name: Update Audit-Derived Test Fixtures

on:
  schedule:
    # Weekly on Sundays at 7am ET (11:00 UTC)
    - cron: '0 11 * * 0'
  workflow_dispatch:

jobs:
  update-fixtures:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run workflow extractor
        env:
          ACUMATICA_URL: ${{ secrets.ACUMATICA_PROD_URL }}
          ACUMATICA_USERNAME: ${{ secrets.ACUMATICA_PROD_USERNAME }}
          ACUMATICA_PASSWORD: ${{ secrets.ACUMATICA_PROD_PASSWORD }}
          ACUMATICA_TENANT: ${{ secrets.ACUMATICA_PROD_TENANT }}
        run: python scripts/generate_sops.py --days 90 --threshold 3

      - name: Check for changes
        id: diff
        run: |
          git diff --name-only tests/fixtures/audit_derived/
          if git diff --quiet tests/fixtures/audit_derived/ && \
             [ -z "$(git ls-files --others --exclude-standard tests/fixtures/audit_derived/)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR with updated fixtures
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="auto/audit-fixtures-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add tests/fixtures/audit_derived/ workflow_patterns.json
          git commit -m "chore: update audit-derived test fixtures (weekly)"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "chore: update audit-derived test fixtures" \
            --body "$(cat <<'EOF'
          ## Summary
          - Weekly refresh of audit-derived regression test fixtures
          - Generated from production audit trail data (last 90 days)
          - New/updated entity fixtures reflect current user workflows

          Auto-generated by the update-audit-fixtures workflow.
          EOF
          )"
