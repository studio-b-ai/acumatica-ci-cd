name: Sandbox — Maintenance (one-off)

# Sandbox-only maintenance operations.
# SAFETY: Only sandbox credentials are used. No prod/test option.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        type: choice
        options:
          - drop-knmc-table
          - unpublish-all
          - unpublish-and-republish
        default: drop-knmc-table
      republish_projects:
        description: "Projects to republish (only for unpublish-and-republish)"
        type: string
        default: "AesthetikContainers,AesthetikWMS,StudioBAcuOps,AsthetikTheme,PXLotSertialNbrAttributeExtPkg"

jobs:
  maintenance:
    name: Sandbox Maintenance
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build drop-table package (uses StudioBAcuOps as carrier)
        if: github.event.inputs.action == 'drop-knmc-table'
        run: |
          # Build a StudioBAcuOps package that includes the DROP TABLE SQL
          # We overlay the drop-table SQL into the existing StudioBAcuOps project.xml
          cp Customization/StudioBAcuOps/project.xml drop-table-project.xml
          # Inject DROP TABLE SQL before closing </Customization> tag
          python3 -c "
          import re
          with open('drop-table-project.xml', 'r') as f:
              content = f.read()
          drop_sql = '''
    <Sql Name=\"DropKNMCSalesPriceSyncData\" Script=\"#CDATA\">
        <CDATA name=\"Script\"><![CDATA[IF OBJECT_ID('dbo.KNMCSalesPriceSyncData', 'U') IS NOT NULL
  BEGIN
      DROP TABLE dbo.KNMCSalesPriceSyncData;
      PRINT 'Dropped table KNMCSalesPriceSyncData';
  END
  ELSE
  BEGIN
      PRINT 'Table KNMCSalesPriceSyncData does not exist';
  END
          ]]></CDATA>
    </Sql>
  '''
          content = content.replace('</Customization>', drop_sql + '</Customization>')
          with open('drop-table-project.xml', 'w') as f:
              f.write(content)
          "
          zip -j drop-table-package.zip drop-table-project.xml
          # Rename inside zip to project.xml
          mkdir -p _tmp && cp drop-table-project.xml _tmp/project.xml
          cd _tmp && zip -j ../drop-table-package.zip project.xml

      - name: Drop KNMC table
        if: github.event.inputs.action == 'drop-knmc-table'
        env:
          ACUMATICA_SANDBOX_URL:      ${{ secrets.ACUMATICA_SANDBOX_URL }}
          ACUMATICA_SANDBOX_USERNAME: ${{ secrets.ACUMATICA_SANDBOX_USERNAME }}
          ACUMATICA_SANDBOX_PASSWORD: ${{ secrets.ACUMATICA_SANDBOX_PASSWORD }}
          ACUMATICA_SANDBOX_TENANT:   ${{ secrets.ACUMATICA_SANDBOX_TENANT }}
          PACKAGE_PATH:               drop-table-package.zip
        run: python3 scripts/sandbox-drop-knmc-table.py

      - name: Unpublish all / republish
        if: github.event.inputs.action != 'drop-knmc-table'
        env:
          ACUMATICA_SANDBOX_URL:      ${{ secrets.ACUMATICA_SANDBOX_URL }}
          ACUMATICA_SANDBOX_USERNAME: ${{ secrets.ACUMATICA_SANDBOX_USERNAME }}
          ACUMATICA_SANDBOX_PASSWORD: ${{ secrets.ACUMATICA_SANDBOX_PASSWORD }}
          ACUMATICA_SANDBOX_TENANT:   ${{ secrets.ACUMATICA_SANDBOX_TENANT }}
          REPUBLISH:                  ${{ github.event.inputs.action == 'unpublish-and-republish' && github.event.inputs.republish_projects || '' }}
        run: python3 scripts/sandbox-unpublish-all.py
