# Countdown Offload Test — Verifies BullMQ delayed dispatch works end-to-end
#
# Posts to webhook-router /deploy/schedule with a 1-minute delay.
# The schedule POST returning 200 + a job ID proves the BullMQ queue
# accepted the delayed job. Status polling is optional (endpoint may not exist).
#
# Safe: uses dry_run=true inputs so even if dispatch fires, nothing publishes.
# Manual dispatch only.

name: Test Countdown Offload

on:
  workflow_dispatch: {}

jobs:
  test-countdown:
    name: Countdown Timer E2E
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Schedule countdown (1-minute delay)
        id: schedule
        env:
          WEBHOOK_ROUTER_URL: ${{ secrets.WEBHOOK_ROUTER_URL }}
          WEBHOOK_AUTH_TOKEN: ${{ secrets.WEBHOOK_AUTH_TOKEN }}
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "${WEBHOOK_ROUTER_URL}/deploy/schedule" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${WEBHOOK_AUTH_TOKEN}" \
            -d '{
              "repo": "studio-b-ai/acumatica-ci-cd",
              "workflow": "deploy-customization.yml",
              "delay_minutes": 1,
              "inputs": { "dry_run": "true", "project_name": "CountdownTest" },
              "notifications": [
                { "minutes_remaining": 1, "channel": "slack" }
              ]
            }')

          HTTP_CODE=$(echo "${RESPONSE}" | tail -1)
          BODY=$(echo "${RESPONSE}" | head -n -1)

          echo "HTTP: ${HTTP_CODE}"
          echo "Body: ${BODY}"

          if [[ "${HTTP_CODE}" != "200" ]]; then
            echo "::error::Schedule request failed (HTTP ${HTTP_CODE})"
            echo "schedule_result=fail" >> "$GITHUB_ENV"
            exit 1
          fi

          echo "schedule_result=pass" >> "$GITHUB_ENV"

          # Extract deploy job ID — pass via GITHUB_ENV (not a secret, just a BullMQ job name)
          DEPLOY_JOB_ID=$(echo "${BODY}" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          ids = data.get('job_ids', [])
          print(ids[0] if ids else 'none')
          " 2>/dev/null || echo "none")

          echo "DEPLOY_JOB_ID=${DEPLOY_JOB_ID}" >> "$GITHUB_ENV"
          echo "Scheduled deploy job: ${DEPLOY_JOB_ID}"

      - name: Wait for countdown (90 seconds)
        run: |
          echo "Waiting 90 seconds for 1-minute delayed job to process..."
          sleep 90

      - name: Check job status (best-effort)
        id: status_check
        continue-on-error: true
        env:
          WEBHOOK_ROUTER_URL: ${{ secrets.WEBHOOK_ROUTER_URL }}
          WEBHOOK_AUTH_TOKEN: ${{ secrets.WEBHOOK_AUTH_TOKEN }}
        run: |
          JOB_ID="${DEPLOY_JOB_ID}"

          if [[ "${JOB_ID}" == "none" || -z "${JOB_ID}" ]]; then
            echo "No job ID to check — skipping status poll"
            echo "status_result=skipped" >> "$GITHUB_ENV"
            exit 0
          fi

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X GET "${WEBHOOK_ROUTER_URL}/deploy/status/${JOB_ID}" \
            -H "Authorization: Bearer ${WEBHOOK_AUTH_TOKEN}")

          HTTP_CODE=$(echo "${RESPONSE}" | tail -1)
          BODY=$(echo "${RESPONSE}" | head -n -1)

          echo "HTTP: ${HTTP_CODE}"
          echo "Body: ${BODY}"

          if [[ "${HTTP_CODE}" == "404" ]]; then
            echo "::warning::Status endpoint not found (404) — /deploy/status not implemented on webhook-router"
            echo "status_result=no_endpoint" >> "$GITHUB_ENV"
            exit 0
          fi

          if [[ "${HTTP_CODE}" != "200" ]]; then
            echo "::warning::Status check returned HTTP ${HTTP_CODE}"
            echo "status_result=error" >> "$GITHUB_ENV"
            exit 0
          fi

          STATE=$(echo "${BODY}" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          print(data.get('state', 'unknown'))
          ")

          echo "Job state: ${STATE}"
          echo "status_result=${STATE}" >> "$GITHUB_ENV"

          if [[ "${STATE}" == "delayed" || "${STATE}" == "waiting" ]]; then
            echo "::error::Job still in ${STATE} state after 90s — BullMQ delay not working"
            exit 1
          fi

      - name: Evaluate results
        run: |
          SCHEDULE="${schedule_result}"
          STATUS="${status_result}"

          echo "Schedule POST: ${SCHEDULE}"
          echo "Status check:  ${STATUS}"

          # The critical assertion: schedule POST must succeed
          if [[ "${SCHEDULE}" != "pass" ]]; then
            echo "::error::FAIL — webhook-router /deploy/schedule did not accept the job"
            exit 1
          fi

          echo "PASS — BullMQ countdown job was accepted by webhook-router"

          if [[ "${STATUS}" == "no_endpoint" ]]; then
            echo "::warning::Status endpoint missing — consider adding GET /deploy/status/:id to webhook-router"
          elif [[ "${STATUS}" == "completed" || "${STATUS}" == "failed" ]]; then
            echo "Job was processed (state: ${STATUS}) — full E2E verified"
          fi

      - name: Test Summary
        if: always()
        run: |
          echo "## Countdown Offload Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          SCHED_ICON=$([[ "${schedule_result}" == "pass" ]] && echo ":white_check_mark:" || echo ":x:")
          echo "| Schedule POST accepted | ${SCHED_ICON} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job ID returned | \`${DEPLOY_JOB_ID}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status check | ${status_result:-pending} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Delay: 1 minute" >> "$GITHUB_STEP_SUMMARY"
          echo "- Inputs: \`dry_run=true\` (safe — nothing publishes)" >> "$GITHUB_STEP_SUMMARY"
