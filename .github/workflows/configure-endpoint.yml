name: Configure REST Endpoint

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode to run'
        required: true
        default: 'schema-only'
        type: choice
        options:
          - schema-only
          - configure
          - verify
          - grant-access
          - discover-access-screens
          - fix-entities

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run endpoint configuration
        env:
          ACUMATICA_URL: ${{ secrets.ACUMATICA_PROD_URL }}
          ACUMATICA_USERNAME: ${{ secrets.ACUMATICA_PROD_USERNAME }}
          ACUMATICA_PASSWORD: ${{ secrets.ACUMATICA_PROD_PASSWORD }}
          ACUMATICA_TENANT: ${{ secrets.ACUMATICA_PROD_TENANT }}
        run: |
          if [ "${{ inputs.mode }}" = "discover-access-screens" ]; then
            python scripts/configure-container-endpoint.py --schema
          elif [ "${{ inputs.mode }}" = "grant-access" ]; then
            python scripts/configure-container-endpoint.py --grant
          elif [ "${{ inputs.mode }}" = "fix-entities" ]; then
            python scripts/fix-container-entity-names.py
          else
            python scripts/configure-container-endpoint.py --${{ inputs.mode }}
          fi

      - name: Upload schema artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schemas
          path: /tmp/sm*.xml
          retention-days: 7
          if-no-files-found: ignore
