name: Sandbox — Execute SQL (one-off)

# Executes arbitrary SQL on the SANDBOX instance via SOAP Screen API.
# SAFETY: Only sandbox credentials are used. No prod/test option.

on:
  workflow_dispatch:
    inputs:
      schema_only:
        description: "Dump screen schema only (no SQL execution)"
        type: boolean
        default: true
      sql_script:
        description: "SQL to execute (leave blank for default DROP KNMCSalesPriceSyncData)"
        type: string
        default: ""

jobs:
  exec-sql:
    name: Execute SQL on Sandbox
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run sandbox-exec-sql.py
        env:
          ACUMATICA_SANDBOX_URL:      ${{ secrets.ACUMATICA_SANDBOX_URL }}
          ACUMATICA_SANDBOX_USERNAME: ${{ secrets.ACUMATICA_SANDBOX_USERNAME }}
          ACUMATICA_SANDBOX_PASSWORD: ${{ secrets.ACUMATICA_SANDBOX_PASSWORD }}
          ACUMATICA_SANDBOX_TENANT:   ${{ secrets.ACUMATICA_SANDBOX_TENANT }}
          SCHEMA_ONLY:                ${{ github.event.inputs.schema_only }}
          SQL_SCRIPT:                 ${{ github.event.inputs.sql_script }}
        run: python3 scripts/sandbox-exec-sql.py
