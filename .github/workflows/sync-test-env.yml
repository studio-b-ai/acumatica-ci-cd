# Nightly Test Environment Sync — REST Entity-Level
#
# Copies key business entities (Customers, StockItems, Vendors, Employees)
# from the production tenant to the test tenant using REST API upsert (PUT).
# SalesOrders are read-only (count comparison, no write).
#
# Two-phase design: reads all prod data first (one session), then writes
# to test (separate session) — avoids Acumatica session gate conflicts.
#
# Schedule: nightly at 2am CT (7am UTC) — Acumatica is idle
# Manual dispatch: available for on-demand sync
#
# Previous SOAP approach (SM203520 Company Copy) returned success but
# never executed the copy on Acumatica Cloud — replaced 2026-03-23.

name: Sync Test Environment

on:
  schedule:
    # 2:07am CT (7:07 UTC) — off-minute to avoid fleet crowding
    - cron: '7 7 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Log what would sync without writing'
        required: false
        type: boolean
        default: false

concurrency:
  group: acumatica-sync-test-env
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: '1'

jobs:
  entity-sync:
    name: Entity Sync — Prod → Test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      # After-hours gate — entity sync doesn't restart app pool, but
      # avoid competing with active users for session gate
      - name: After-hours gate
        if: github.event_name == 'schedule'
        run: |
          CT_HOUR=$(TZ=America/Chicago date +%H)
          if [ "$CT_HOUR" -ge 6 ] && [ "$CT_HOUR" -lt 18 ]; then
            echo "::error::Sync blocked — business hours (${CT_HOUR}:00 CT). Runs 6pm-6am only."
            exit 1
          fi
          echo "After-hours confirmed (${CT_HOUR}:00 CT)"

      - name: Run entity sync
        env:
          ACUMATICA_URL: ${{ secrets.ACUMATICA_PROD_URL }}
          ACUMATICA_USERNAME: ${{ secrets.ACUMATICA_PROD_USERNAME }}
          ACUMATICA_PASSWORD: ${{ secrets.ACUMATICA_PROD_PASSWORD }}
          PROD_TENANT: Heritage Fabrics
          TEST_TENANT: Heritage Test
          SLACK_WEBHOOK_URL: ${{ secrets.STUDIOB_SLACK_WEBHOOK_URL }}
        run: python scripts/entity-sync.py

      # Post-sync audit — verify test data actually changed
      - name: Audit sync results
        if: success()
        env:
          ACUMATICA_URL: ${{ secrets.ACUMATICA_PROD_URL }}
          ACUMATICA_USERNAME: ${{ secrets.ACUMATICA_PROD_USERNAME }}
          ACUMATICA_PASSWORD: ${{ secrets.ACUMATICA_PROD_PASSWORD }}
        run: |
          python3 -c "
          import json, os, sys
          import requests

          url = os.environ['ACUMATICA_URL'].rstrip('/')
          user = os.environ['ACUMATICA_USERNAME']
          pw = os.environ['ACUMATICA_PASSWORD']
          base = f'{url}/entity/default/24.200.001'

          results = {}
          for tenant in ['Heritage Fabrics', 'Heritage Test']:
              s = requests.Session()
              r = s.post(f'{url}/entity/auth/login', json={'name': user, 'password': pw, 'tenant': tenant})
              if r.status_code != 204:
                  print(f'AUDIT FAIL: cannot login to {tenant}')
                  sys.exit(1)

              counts = {}
              for entity, key in [('Customer','CustomerID'), ('StockItem','InventoryID'), ('Vendor','VendorID')]:
                  r = s.get(f'{base}/{entity}', params={'\$top': '1', '\$select': key})
                  first = r.json()[0][key]['value'] if r.json() else '(empty)'
                  r2 = s.get(f'{base}/{entity}', params={'\$top': '500', '\$select': key})
                  counts[entity] = {'count': len(r2.json()), 'first': first}

              s.post(f'{url}/entity/auth/logout')
              results[tenant] = counts

          print('\\n=== POST-SYNC AUDIT ===')
          match = True
          for entity in ['Customer', 'StockItem', 'Vendor']:
              prod = results['Heritage Fabrics'][entity]
              test = results['Heritage Test'][entity]
              status = '✅' if prod['first'] == test['first'] else '❌'
              if prod['first'] != test['first']:
                  match = False
              print(f'{status} {entity}: prod={prod[\"count\"]}(first={prod[\"first\"]}), test={test[\"count\"]}(first={test[\"first\"]})')

          if not match:
              print('\\n⚠️  First-record mismatch detected — sync may not have fully propagated')
          else:
              print('\\n✅ Audit passed — test data matches production')
          "

      - name: Post summary
        if: always()
        run: |
          echo "## Test Environment Sync" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Method | REST Entity Sync (PUT upsert) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Source | Heritage Fabrics (production) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Target | Heritage Test (test mirror) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Entities | Customer, StockItem, Vendor, Employee, SalesOrder (read-only) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trigger | ${{ github.event_name }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | ${{ job.status }} |" >> "$GITHUB_STEP_SUMMARY"
