name: Sandbox — Drop KNMC Table

on:
  workflow_dispatch: {}

jobs:
  drop-table:
    name: Drop KNMCSalesPriceSyncData
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build modified StudioBAcuOps package
        run: python3 scripts/build-drop-table-package.py

      - name: Import and publish with dbOnly
        env:
          ACUMATICA_SANDBOX_URL:      ${{ secrets.ACUMATICA_SANDBOX_URL }}
          ACUMATICA_SANDBOX_USERNAME: ${{ secrets.ACUMATICA_SANDBOX_USERNAME }}
          ACUMATICA_SANDBOX_PASSWORD: ${{ secrets.ACUMATICA_SANDBOX_PASSWORD }}
          ACUMATICA_SANDBOX_TENANT:   ${{ secrets.ACUMATICA_SANDBOX_TENANT }}
          PACKAGE_PATH:               drop-table-package.zip
        run: python3 scripts/sandbox-drop-knmc-table.py
