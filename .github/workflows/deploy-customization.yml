# Acumatica Customization CI/CD Pipeline — 3-Tier (Sandbox → Production)
#
# ARCHITECTURE:
#   Sandbox  (heritagefabrics-sandbox.acumatica.com) — isolated instance, safe to break
#   Test     (heritagefabrics.acumatica.com / Heritage Fabrics Test) — shared instance with Prod
#   Prod     (heritagefabrics.acumatica.com / Heritage Fabrics) — live operations
#
#   Test and Prod share the SAME Acumatica instance. Publishing on either
#   restarts the app pool and recompiles ALL projects for BOTH tenants.
#   Sandbox is the ONLY safe place to test customization publishing.
#
# PROMOTION FLOW:
#   feature branch push → deploy to SANDBOX (auto, full publish)
#   PR to main          → build + validate XML only (no publish anywhere)
#   merge to main       → build only (NO auto-deploy)
#   workflow_dispatch    → choose sandbox or production (production requires approval)
#
# CRITICAL RULE:
#   Push to main does NOT auto-deploy to production. EVER.
#   Production deploys are manual workflow_dispatch only.

name: Deploy Acumatica Customization

concurrency:
  group: acumatica-deploy-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ['**']
    paths:
      - 'Customization/**'
      - 'config/package-registry.json'
      - 'scripts/**'
      - '.github/workflows/deploy-customization.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Customization/**'
      - 'config/package-registry.json'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - sandbox
          - production
      dry_run:
        description: 'Validate only (no publish)'
        required: false
        type: boolean
        default: false
      skip_countdown:
        description: 'Emergency deploy — skip 20-min countdown'
        required: false
        type: boolean
        default: false

env:
  PROJECT_NAME: AesthetikWMS

jobs:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Job 1: Build + resolve target environment
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  build:
    name: Build Customization Package
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.resolve.outputs.target }}
      also_publish: ${{ steps.registry.outputs.also_publish }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve target environment
        id: resolve
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TARGET="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            TARGET="validate-only"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            TARGET="build-only"
          else
            TARGET="sandbox"
          fi
          echo "target=${TARGET}" >> "$GITHUB_OUTPUT"
          echo "Target: ${TARGET}"

      - name: Read package registry
        id: registry
        run: |
          TARGET="${{ steps.resolve.outputs.target }}"
          ENV_KEY="sandbox"
          if [[ "${TARGET}" == "production" ]]; then ENV_KEY="production"; fi

          if [ ! -f config/package-registry.json ]; then
            echo "also_publish=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ALSO_PUBLISH=$(python3 -c "
          import json
          with open('config/package-registry.json') as f:
              reg = json.load(f)
          env_key = '${ENV_KEY}'
          pkgs = reg.get(env_key, {}).get('packages', {})
          print(','.join(pkgs.get('custom', []) + pkgs.get('isv', [])))
          ")
          echo "also_publish=${ALSO_PUBLISH}" >> "$GITHUB_OUTPUT"
          echo "ALSO_PUBLISH (${ENV_KEY}): ${ALSO_PUBLISH}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify project folder exists
        run: |
          if [ ! -d "Customization/${PROJECT_NAME}" ]; then
            echo "::error::Customization/${PROJECT_NAME}/ does not exist"
            ls -d Customization/*/ 2>/dev/null || echo "(none)"
            exit 1
          fi

      - name: Validate project.xml
        run: |
          python scripts/validate-project.py Customization/${PROJECT_NAME}/project.xml
          TARGET="${{ steps.resolve.outputs.target }}"
          if [[ "${TARGET}" == "production" || "${TARGET}" == "build-only" ]]; then
            python scripts/validate-project.py --strict Customization/${PROJECT_NAME}/project.xml
          fi

      - name: Validate package registry
        if: hashFiles('scripts/validate-registry.py') != ''
        run: |
          ENV_KEY="sandbox"
          if [[ "${{ steps.resolve.outputs.target }}" == "production" ]]; then ENV_KEY="production"; fi
          python scripts/validate-registry.py --registry config/package-registry.json --environment "${ENV_KEY}" --offline

      - name: Check for C# extension library
        id: check_csproj
        run: |
          if ls Customization/*.csproj 1>/dev/null 2>&1; then
            echo "has_csproj=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_csproj=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@v4
        if: steps.check_csproj.outputs.has_csproj == 'true'
        with:
          dotnet-version: '6.0.x'

      - name: Build C# extension library
        if: steps.check_csproj.outputs.has_csproj == 'true'
        run: cd Customization && dotnet restore && dotnet build --configuration Release --no-restore

      - name: Package customization project
        id: package
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          mkdir -p dist
          cd Customization/${PROJECT_NAME}
          zip -r "../../dist/${PROJECT_NAME}_${TIMESTAMP}.zip" . -x "*.DS_Store" -x "__MACOSX/*" -x "*.user" -x "bin/*" -x "obj/*"
          cd ../..
          [ -d "Customization/bin/Release" ] && cd Customization/bin/Release && zip -ur "../../../dist/${PROJECT_NAME}_${TIMESTAMP}.zip" *.dll 2>/dev/null || true && cd ../../..
          echo "path=dist/${PROJECT_NAME}_${TIMESTAMP}.zip" >> "$GITHUB_OUTPUT"

      - name: Package extra projects
        run: |
          ALSO_PUBLISH="${{ steps.registry.outputs.also_publish }}"
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          for dir in Customization/*/; do
            dirname=$(basename "${dir}")
            [[ "${dirname}" == "${PROJECT_NAME}" || "${dirname}" == "_project" ]] && continue
            [[ ! ",${ALSO_PUBLISH}," == *",${dirname},"* ]] && continue
            if [ -f "${dir}project.xml" ]; then
              cd "${dir}" && zip -r "../../dist/${dirname}_${TIMESTAMP}.zip" . -x "*.DS_Store" -x "__MACOSX/*" && cd ../..
              echo "Extra: ${dirname}"
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: customization-package
          path: dist/*.zip
          retention-days: 30

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Job 2: Deploy to Sandbox — feature branches, auto, no gates
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  deploy-sandbox:
    name: Deploy to Sandbox
    needs: build
    runs-on: ubuntu-latest
    if: needs.build.outputs.target == 'sandbox'
    environment: sandbox
    env:
      ACUMATICA_URL: ${{ secrets.ACUMATICA_SANDBOX_URL }}
      ACUMATICA_USERNAME: ${{ secrets.ACUMATICA_PROD_USERNAME }}
      ACUMATICA_PASSWORD: ${{ secrets.ACUMATICA_PROD_PASSWORD }}
      ACUMATICA_TENANT: ${{ secrets.ACUMATICA_SANDBOX_TENANT }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: customization-package
          path: dist/
      - run: pip install -r scripts/requirements.txt

      - name: Deploy to Sandbox
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.STUDIOB_SLACK_WEBHOOK_URL }}
        run: |
          PACKAGE_FILE=$(ls dist/${PROJECT_NAME}_*.zip 2>/dev/null | head -1)
          [ -z "${PACKAGE_FILE}" ] && PACKAGE_FILE=$(ls dist/*.zip | head -1)

          EXTRA_FLAGS=""
          for pkg in dist/*.zip; do
            [ "${pkg}" = "${PACKAGE_FILE}" ] && continue
            PKG_NAME=$(basename "${pkg}" .zip | sed 's/_[0-9]\{8\}-[0-9]\{6\}$//')
            EXTRA_FLAGS+=" --extra-import ${PKG_NAME}:${pkg}"
          done

          chmod +x scripts/deploy.sh
          scripts/deploy.sh \
            --project "${PROJECT_NAME}" \
            --package "${PACKAGE_FILE}" \
            --also-publish "${{ needs.build.outputs.also_publish }}" \
            --environment sandbox \
            --backup \
            ${EXTRA_FLAGS} \
            $( [[ "${{ github.event.inputs.dry_run }}" == "true" ]] && echo "--validate-only" )

      - name: Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.STUDIOB_SLACK_WEBHOOK_URL }}
        run: |
          [ -n "${SLACK_WEBHOOK_URL}" ] && curl -s -X POST "${SLACK_WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\":warning: Sandbox deploy failed: \`${PROJECT_NAME}\` on \`${{ github.ref_name }}\`\n${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Job 3: Deploy to Production — manual only, approval required
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  deploy-production:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    if: needs.build.outputs.target == 'production'
    environment: production
    env:
      ACUMATICA_URL: ${{ secrets.ACUMATICA_PROD_URL }}
      ACUMATICA_USERNAME: ${{ secrets.ACUMATICA_PROD_USERNAME }}
      ACUMATICA_PASSWORD: ${{ secrets.ACUMATICA_PROD_PASSWORD }}
      ACUMATICA_TENANT: ${{ secrets.ACUMATICA_PROD_TENANT }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: customization-package
          path: dist/
      - run: pip install -r scripts/requirements.txt

      - name: Pre-deploy snapshot
        id: snapshot
        if: github.event.inputs.dry_run != 'true'
        continue-on-error: true
        run: python scripts/snapshot.py --project "${PROJECT_NAME}" --output backups/

      - uses: actions/upload-artifact@v4
        if: steps.snapshot.outcome == 'success'
        with:
          name: pre-deploy-snapshot-${{ github.run_number }}
          path: backups/*.zip
          retention-days: 90

      - name: Check if after-hours
        id: hours
        run: |
          CT_HOUR=$(TZ=America/Chicago date +%H)
          if [ "$CT_HOUR" -ge 18 ] || [ "$CT_HOUR" -lt 6 ]; then
            echo "after_hours=true" >> "$GITHUB_OUTPUT"
          else
            echo "after_hours=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Maintenance countdown
        if: |
          github.event.inputs.skip_countdown != 'true' &&
          github.event.inputs.dry_run != 'true' &&
          steps.hours.outputs.after_hours != 'true'
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SLACK_WEBHOOK_URL: ${{ secrets.STUDIOB_SLACK_WEBHOOK_URL }}
          NOTIFY_RECIPIENTS: ${{ vars.MAINTENANCE_NOTIFY_RECIPIENTS }}
          NOTIFY_SENDER: ${{ vars.MAINTENANCE_NOTIFY_SENDER || 'kevin@heritagefabrics.com' }}
        run: |
          python scripts/notify.py --type countdown --minutes 20 --recipients "${NOTIFY_RECIPIENTS}" --sender "${NOTIFY_SENDER}" --project "${PROJECT_NAME}" --environment production --slack-webhook "${SLACK_WEBHOOK_URL}" || true
          sleep 900
          python scripts/notify.py --type countdown --minutes 5 --recipients "${NOTIFY_RECIPIENTS}" --sender "${NOTIFY_SENDER}" --project "${PROJECT_NAME}" --environment production --slack-webhook "${SLACK_WEBHOOK_URL}" || true
          sleep 240
          python scripts/notify.py --type countdown --minutes 1 --recipients "${NOTIFY_RECIPIENTS}" --sender "${NOTIFY_SENDER}" --project "${PROJECT_NAME}" --environment production --slack-webhook "${SLACK_WEBHOOK_URL}" || true
          sleep 60

      - name: Enter maintenance mode
        if: github.event.inputs.dry_run != 'true'
        run: |
          curl -sf -X POST "https://webhook-router-production-e161.up.railway.app/maintenance/start" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.PROVISION_API_KEY }}" \
            -d '{"reason":"Customization publish","ttl_seconds":3600}' || echo "::warning::Maintenance mode unavailable"

      - name: Deploy customization
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.STUDIOB_SLACK_WEBHOOK_URL }}
        run: |
          PACKAGE_FILE=$(ls dist/${PROJECT_NAME}_*.zip 2>/dev/null | head -1)
          [ -z "${PACKAGE_FILE}" ] && PACKAGE_FILE=$(ls dist/*.zip | head -1)
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"

          EXTRA_FLAGS=""
          for pkg in dist/*.zip; do
            [ "${pkg}" = "${PACKAGE_FILE}" ] && continue
            PKG_NAME=$(basename "${pkg}" .zip | sed 's/_[0-9]\{8\}-[0-9]\{6\}$//')
            EXTRA_FLAGS+=" --extra-import ${PKG_NAME}:${pkg}"
          done

          chmod +x scripts/deploy.sh
          scripts/deploy.sh \
            --project "${PROJECT_NAME}" \
            --package "${PACKAGE_FILE}" \
            --also-publish "${{ needs.build.outputs.also_publish }}" \
            --environment production \
            --backup \
            --manifest publish-manifest.json \
            ${EXTRA_FLAGS} \
            $( [[ "${DRY_RUN}" == "true" ]] && echo "--validate-only" )

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: customization-backup
          path: dist/backup/*.zip
          retention-days: 30
          if-no-files-found: ignore

      - name: Exit maintenance mode
        if: always() && github.event.inputs.dry_run != 'true'
        continue-on-error: true
        run: |
          curl -sf -X POST "https://webhook-router-production-e161.up.railway.app/maintenance/end" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.PROVISION_API_KEY }}" || echo "::warning::Maintenance TTL will auto-expire"

      - name: Notify system online
        if: success()
        continue-on-error: true
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SLACK_WEBHOOK_URL: ${{ secrets.STUDIOB_SLACK_WEBHOOK_URL }}
          NOTIFY_RECIPIENTS: ${{ vars.MAINTENANCE_NOTIFY_RECIPIENTS }}
          NOTIFY_SENDER: ${{ vars.MAINTENANCE_NOTIFY_SENDER || 'kevin@heritagefabrics.com' }}
        run: |
          python scripts/notify.py --type online --recipients "${NOTIFY_RECIPIENTS}" --sender "${NOTIFY_SENDER}" --project "${PROJECT_NAME}" --environment production --slack-webhook "${SLACK_WEBHOOK_URL}" ${{ steps.hours.outputs.after_hours == 'true' && '--skip-email' || '' }}

      - name: Notify deploy failed
        if: failure()
        continue-on-error: true
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SLACK_WEBHOOK_URL: ${{ secrets.STUDIOB_SLACK_WEBHOOK_URL }}
          NOTIFY_RECIPIENTS: ${{ vars.MAINTENANCE_NOTIFY_RECIPIENTS }}
          NOTIFY_SENDER: ${{ vars.MAINTENANCE_NOTIFY_SENDER || 'kevin@heritagefabrics.com' }}
        run: |
          python scripts/notify.py --type failed --recipients "${NOTIFY_RECIPIENTS}" --sender "${NOTIFY_SENDER}" --project "${PROJECT_NAME}" --environment production --slack-webhook "${SLACK_WEBHOOK_URL}" ${{ steps.hours.outputs.after_hours == 'true' && '--skip-email' || '' }}

      - name: Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.STUDIOB_SLACK_WEBHOOK_URL }}
        run: |
          [ -n "${SLACK_WEBHOOK_URL}" ] && curl -s -X POST "${SLACK_WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\":x: *Production Deploy FAILED*\nProject: \`${PROJECT_NAME}\`\nCommit: \`${GITHUB_SHA::8}\`\nActor: @${GITHUB_ACTOR}\n${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Job 4: Validate — PR check (no publish, against sandbox)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  validate:
    name: Validate (PR Check)
    needs: build
    runs-on: ubuntu-latest
    if: needs.build.outputs.target == 'validate-only'
    env:
      ACUMATICA_URL: ${{ secrets.ACUMATICA_SANDBOX_URL }}
      ACUMATICA_USERNAME: ${{ secrets.ACUMATICA_PROD_USERNAME }}
      ACUMATICA_PASSWORD: ${{ secrets.ACUMATICA_PROD_PASSWORD }}
      ACUMATICA_TENANT: ${{ secrets.ACUMATICA_SANDBOX_TENANT }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: customization-package
          path: dist/

      - name: Validate against Sandbox
        run: |
          PACKAGE_FILE=$(ls dist/${PROJECT_NAME}_*.zip 2>/dev/null | head -1)
          [ -z "${PACKAGE_FILE}" ] && PACKAGE_FILE=$(ls dist/*.zip | head -1)

          EXTRA_FLAGS=""
          for pkg in dist/*.zip; do
            [ "${pkg}" = "${PACKAGE_FILE}" ] && continue
            PKG_NAME=$(basename "${pkg}" .zip | sed 's/_[0-9]\{8\}-[0-9]\{6\}$//')
            EXTRA_FLAGS+=" --extra-import ${PKG_NAME}:${pkg}"
          done

          chmod +x scripts/deploy.sh
          scripts/deploy.sh \
            --project "${PROJECT_NAME}" \
            --package "${PACKAGE_FILE}" \
            --also-publish "${{ needs.build.outputs.also_publish }}" \
            --environment sandbox \
            ${EXTRA_FLAGS} \
            --validate-only

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Job 5: Post-deploy tests (production only)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  post-deploy-validation:
    name: Trigger Runtime Tests
    needs: deploy-production
    runs-on: ubuntu-latest
    if: needs.deploy-production.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: Trigger ui-test-suite
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_DISPATCH }}
        run: |
          [ -z "${GH_TOKEN}" ] && echo "::warning::GH_PAT_DISPATCH not set" && exit 0
          gh api repos/studio-b-ai/ui-test-suite/dispatches \
            --method POST \
            -f event_type=post-deploy-validation \
            -f "client_payload[commit]=${GITHUB_SHA::8}" \
            -f "client_payload[project]=${PROJECT_NAME}" \
            -f "client_payload[suite]=@write-path"
