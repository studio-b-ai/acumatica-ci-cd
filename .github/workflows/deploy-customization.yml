# Acumatica Customization CI/CD Pipeline
# Deploys customization projects via the Customization API
#
# Triggers:
#   - Push to main     → Deploy to PRODUCTION
#   - Push to staging   → Deploy to STAGING
#   - Pull request      → Validate against STAGING (no publish)
#   - Manual dispatch   → Choose target environment
#
# Required GitHub Secrets (per environment):
#   ACUMATICA_PROD_URL        - Production instance URL
#   ACUMATICA_PROD_USERNAME   - Production API user
#   ACUMATICA_PROD_PASSWORD   - Production API password
#   ACUMATICA_PROD_TENANT     - Production tenant name
#   ACUMATICA_STG_*           - Staging equivalents (same instance, test company)
#
# Required GitHub Variables:
#   CUSTOMIZATION_PROJECT_NAME      - Name of the customization project in Acumatica
#   ALSO_PUBLISH_PROJECTS           - Comma-separated list of ALL projects that must stay published
#                                     on PRODUCTION (managed + ISVs — publishBegin sets the EXACT published set)
#   ALSO_PUBLISH_HERITAGE_TEST      - Same but for Heritage Test tenant (managed code only, no ISVs)
#   MAINTENANCE_NOTIFY_RECIPIENTS   - Comma-separated emails for maintenance countdown notifications
#   MAINTENANCE_NOTIFY_SENDER       - Sender email for notifications (default: kevin@heritagefabrics.com)
#
# Optional GitHub Secrets (for email notifications via Microsoft Graph API):
#   AZURE_TENANT_ID       - Entra tenant ID
#   AZURE_CLIENT_ID       - Entra app client ID (Mail.Send permission required)
#   AZURE_CLIENT_SECRET   - Entra app client secret

name: Deploy Acumatica Customization

# ━━━ CONCURRENCY CONTROL ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Acumatica publishes restart the app pool and recompile ALL customization
# projects. Overlapping publishes can corrupt the runtime state.
# Only ONE deploy may run per branch at a time. If a new push arrives while
# a deploy is in progress, the in-progress run is cancelled.
# See: AAR-2026-03-18-acumatica-outage.md
concurrency:
  group: acumatica-deploy-${{ github.ref }}
  cancel-in-progress: true

on:
  repository_dispatch:
    types: [scheduled-deploy]
  push:
    branches: [main, staging]
    paths:
      - 'Customization/**'
      - 'scripts/deploy.sh.deprecated'
      - 'scripts/deploy.py'
      - 'scripts/validate-project.py'
      - 'scripts/validate-publish.py'
      - 'scripts/snapshot.py'
      - 'scripts/notify.py'
      - '.github/workflows/deploy-customization.yml'
  pull_request:
    branches: [main, staging]
    paths:
      - 'Customization/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
      dry_run:
        description: 'Validate only (no publish)'
        required: false
        type: boolean
        default: false
      skip_countdown:
        description: 'Emergency deploy — skip 20-min countdown (still takes snapshot)'
        required: false
        type: boolean
        default: false
      force_qualify:
        description: 'Skip qualification checks (emergency override)'
        required: false
        type: boolean
        default: false
      countdown_complete:
        description: 'Set by scheduled deploy — skip countdown'
        required: false
        type: boolean
        default: false

env:
  # HARDCODED — never use a mutable GitHub variable for the project name.
  # Changing this creates orphaned projects that corrupt the customization subsystem.
  # See: 2026-03-22 incident — AesthetikWMSv2/v3 orphans blocked all deploys.
  PROJECT_NAME: AesthetikWMS
  ALSO_PUBLISH: ${{ vars.ALSO_PUBLISH_PROJECTS || '' }}
  KNOWN_PROJECTS: "AesthetikWMS,AsthetikTheme,StudioBAcuOps"
  ISV_PACKAGES: ""  # IIG packages (IIGHFContainerMods, IIGGlobalContainerMgmt) removed — replaced by AesthetikContainers

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Build — Package customization into .zip
  # ──────────────────────────────────────────────
  build:
    name: Build Customization Package
    runs-on: ubuntu-latest
    outputs:
      package_path: ${{ steps.package.outputs.path }}
      package_name: ${{ steps.package.outputs.name }}
      plugin_changes: ${{ steps.plugin_check.outputs.plugin_changes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Detect plugin changes
        id: plugin_check
        run: |
          DIFF=$(git diff origin/main -- '*.xml' '*.cs' 2>/dev/null || true)
          if echo "$DIFF" | grep -qiE '(CustomizationPlugin|UpdateDatabase|<Sql>|ExecuteSQL|SqlCommand)'; then
            echo "plugin_changes=true" >> "$GITHUB_OUTPUT"
            echo "::warning::CustomizationPlugin changes detected"
          else
            echo "plugin_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify project folder exists
        run: |
          if [ ! -d "Customization/${PROJECT_NAME}" ]; then
            echo "::error::FATAL: Customization/${PROJECT_NAME}/ does not exist."
            echo "The PROJECT_NAME env var must match an existing folder under Customization/."
            echo "Available folders:"
            ls -d Customization/*/ 2>/dev/null || echo "  (none)"
            exit 1
          fi

      - name: Validate ALL customization projects
        env:
          ALSO_PUBLISH_PROJECTS: ${{ vars.ALSO_PUBLISH_PROJECTS || '' }}
        run: |
          # CRITICAL: Validate EVERY project.xml in Customization/.
          # Acumatica compiles ALL imported projects during publish — not just
          # the ones in publishBegin's projectNames. Any project in this repo
          # could end up on the instance and compiled. Validate everything.
          # See: ARR-2026-03-26-stockitem-invalid-columns.md
          FAILED=0
          VALIDATED=0
          SKIPPED=0

          for PROJECT_XML in Customization/*/project.xml; do
            [ ! -f "$PROJECT_XML" ] && continue
            proj=$(basename $(dirname "$PROJECT_XML"))

            # Skip known test/rollback projects
            if [[ "$proj" == "CICDRollbackTest" ]] || [[ "$proj" == "_project" ]]; then
              echo "Skipping test project: $proj"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            echo ""
            echo "━━━ Validating: $proj ━━━"
            STRICT_FLAG=""
            if [[ "${{ github.ref }}" == "refs/heads/main" ]] && [[ "$proj" == "${PROJECT_NAME}" ]]; then
              STRICT_FLAG="--strict"
              echo "(strict mode — production primary project)"
            fi

            if ! python scripts/validate-project.py $STRICT_FLAG "$PROJECT_XML"; then
              echo "::error::Project '$proj' failed validation"
              FAILED=$((FAILED + 1))
            fi
            VALIDATED=$((VALIDATED + 1))
          done

          echo ""
          echo "━━━ Validation Summary ━━━"
          echo "Validated: $VALIDATED | Failed: $FAILED | Skipped: $SKIPPED"

          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED project(s) failed validation. Fix ALL before deploying."
            exit 1
          fi
          echo "✅ All $VALIDATED projects passed validation"

      - name: Check for C# extension library
        id: check_csproj
        run: |
          if ls Customization/*.csproj 1>/dev/null 2>&1; then
            echo "has_csproj=true" >> "$GITHUB_OUTPUT"
            echo "Found C# project — will build extension library"
          else
            echo "has_csproj=false" >> "$GITHUB_OUTPUT"
            echo "No C# project — packaging XML/ASPX only"
          fi

      - name: Setup .NET (if C# extension exists)
        if: steps.check_csproj.outputs.has_csproj == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Build C# extension library
        if: steps.check_csproj.outputs.has_csproj == 'true'
        run: |
          cd Customization
          dotnet restore
          dotnet build --configuration Release --no-restore
          echo "Extension library built successfully"

      - name: Package customization project
        id: package
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          PACKAGE_NAME="${PROJECT_NAME}_${TIMESTAMP}.zip"
          PACKAGE_PATH="dist/${PACKAGE_NAME}"

          mkdir -p dist

          cd Customization/${PROJECT_NAME}
          zip -r "../../${PACKAGE_PATH}" . \
            -x "*.DS_Store" \
            -x "__MACOSX/*" \
            -x "*.user" \
            -x "bin/*" \
            -x "obj/*"
          cd ../..

          # Include compiled DLLs if they exist
          if [ -d "Customization/bin/Release" ]; then
            cd Customization/bin/Release
            zip -ur "../../../${PACKAGE_PATH}" *.dll 2>/dev/null || true
            cd ../../..
          fi

          FILESIZE=$(du -h "${PACKAGE_PATH}" | cut -f1)
          echo "Packaged: ${PACKAGE_NAME} (${FILESIZE})"

          echo "path=${PACKAGE_PATH}" >> "$GITHUB_OUTPUT"
          echo "name=${PACKAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Package extra customization projects
        env:
          ALSO_PUBLISH: ${{ vars.ALSO_PUBLISH_PROJECTS || '' }}
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          # Only package directories that appear in ALSO_PUBLISH_PROJECTS
          # Only managed projects in ALSO_PUBLISH_PROJECTS get packaged
          for dir in Customization/*/; do
            dirname=$(basename "${dir}")
            if [[ "${dirname}" == "${PROJECT_NAME}" ]] || [[ "${dirname}" == "_project" ]]; then
              continue
            fi
            # Skip if not in ALSO_PUBLISH list
            if [[ ! ",${ALSO_PUBLISH}," == *",${dirname},"* ]]; then
              echo "Skipping ${dirname} — not in ALSO_PUBLISH_PROJECTS"
              continue
            fi
            if [ -f "${dir}project.xml" ]; then
              EXTRA_ZIP="dist/${dirname}_${TIMESTAMP}.zip"
              cd "${dir}"
              zip -r "../../${EXTRA_ZIP}" . \
                -x "*.DS_Store" \
                -x "__MACOSX/*" \
                -x "*.user"
              cd ../..
              FILESIZE=$(du -h "${EXTRA_ZIP}" | cut -f1)
              echo "Extra package: ${dirname} (${FILESIZE})"
            fi
          done

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: customization-package
          path: dist/*.zip
          retention-days: 30

  # ──────────────────────────────────────────────
  # Job 2: Qualify — Agentic pre-deploy checks
  # ──────────────────────────────────────────────
  qualify:
    name: Pre-Deploy Qualification
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5  # Hard cap — prevents runaway retries from blocking the runner
    if: github.event_name != 'pull_request' && github.event.inputs.force_qualify != 'true'
    outputs:
      decision: ${{ steps.qualify.outputs.decision }}
      needs_countdown: ${{ steps.qualify.outputs.needs_countdown }}
      summary: ${{ steps.qualify.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Run qualification checks
        id: qualify
        timeout-minutes: 4  # Must be less than job timeout
        env:
          PYTHONUNBUFFERED: "1"
          ACUMATICA_URL: ${{ secrets.ACUMATICA_PROD_URL }}
          ACUMATICA_USERNAME: ${{ secrets.ACUMATICA_PROD_USERNAME }}
          ACUMATICA_PASSWORD: ${{ secrets.ACUMATICA_PROD_PASSWORD }}
          ACUMATICA_TENANT: ${{ secrets.ACUMATICA_PROD_TENANT }}
          SLACK_WEBHOOK_URL: ${{ secrets.STUDIOB_SLACK_WEBHOOK_URL }}
          KNOWN_PROJECTS: ${{ env.KNOWN_PROJECTS }}
          ISV_PACKAGES: ${{ env.ISV_PACKAGES }}
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
        run: python scripts/qualify.py

  # ──────────────────────────────────────────────
  # Job 3: Countdown — offloaded to webhook-router
  # ──────────────────────────────────────────────
  # ──────────────────────────────────────────────
  # Job 3: Heritage Test — Hard gate on prod instance test tenant (pre-prod validation)
  # Sandbox gate removed 2026-04-01 — sandbox instance corrupted and blocking deploys.
  # Heritage Test runs on the production instance's test tenant, which is the real
  # pre-production validation environment.
  # ──────────────────────────────────────────────
  heritage-test-gate:
    name: Heritage Test Publish Gate
    needs: [build, qualify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      always() &&
      needs.build.result == 'success' &&
      github.event_name != 'pull_request' &&
      github.event.inputs.force_qualify != 'true' && (
        needs.qualify.result == 'success' ||
        needs.qualify.result == 'skipped'
      )
    concurrency:
      group: heritage-test-publish
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: customization-package
          path: dist/

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Deploy to Heritage Test
        id: deploy
        run: |
          PACKAGE_FILE=$(ls dist/${PROJECT_NAME}_*.zip 2>/dev/null | head -1)
          if [ -z "${PACKAGE_FILE}" ]; then
            PACKAGE_FILE=$(ls dist/*.zip | head -1)
          fi

          EXTRA_FLAGS=""
          HT_COPUBLISH=""
          for pkg in dist/*.zip; do
            if [ "${pkg}" != "${PACKAGE_FILE}" ]; then
              PKG_BASE=$(basename "${pkg}" .zip)
              PKG_NAME=$(echo "${PKG_BASE}" | sed 's/_[0-9]\{8\}-[0-9]\{6\}$//')
              EXTRA_FLAGS+=" --extra-import ${PKG_NAME}:${pkg}"
              if [ -n "${HT_COPUBLISH}" ]; then
                HT_COPUBLISH+=",${PKG_NAME}"
              else
                HT_COPUBLISH="${PKG_NAME}"
              fi
            fi
          done

          # Heritage Test uses only managed code — no ISV packages.
          # Separate ALSO_PUBLISH list so we don't reference packages
          # that don't exist in the test tenant.
          HT_ALSO_PUBLISH="${{ vars.ALSO_PUBLISH_HERITAGE_TEST || 'AesthetikContainers,StudioBAcuOps' }}"
          python scripts/deploy.py \
            --url "${{ secrets.ACUMATICA_URL }}" \
            --username "${{ secrets.ACUMATICA_USERNAME }}" \
            --password "${{ secrets.ACUMATICA_PASSWORD }}" \
            --tenant "${{ vars.ACUMATICA_TEST_TENANT }}" \
            --project "${PROJECT_NAME}" \
            --package "${PACKAGE_FILE}" \
            --also-publish "${HT_ALSO_PUBLISH}" \
            ${EXTRA_FLAGS}

      - name: Validate Heritage Test
        id: verify
        run: |
          python scripts/validate-publish.py \
            --url "${{ secrets.ACUMATICA_URL }}" \
            --username "${{ secrets.ACUMATICA_USERNAME }}" \
            --password "${{ secrets.ACUMATICA_PASSWORD }}" \
            --tenant "${{ vars.ACUMATICA_TEST_TENANT }}" \
            --manifest publish-manifest.json

      - name: E2E view-level smoke test
        id: e2e
        run: |
          python scripts/smoke-e2e.py \
            --url "${{ secrets.ACUMATICA_URL }}" \
            --username "${{ secrets.ACUMATICA_USERNAME }}" \
            --password "${{ secrets.ACUMATICA_PASSWORD }}" \
            --tenant "${{ vars.ACUMATICA_TEST_TENANT }}" \
            --manifest publish-manifest.json

      - name: Post-publish login smoke test
        id: smoke
        run: |
          python -c "
          import sys, os
          sys.path.insert(0, '.')
          from scripts.deploy import AcumaticaCustomizationClient
          client = AcumaticaCustomizationClient(
              '${{ secrets.ACUMATICA_URL }}',
              '${{ secrets.ACUMATICA_USERNAME }}',
              '${{ secrets.ACUMATICA_PASSWORD }}',
              '${{ vars.ACUMATICA_TEST_TENANT }}',
          )
          client.login()
          ok = client.smoke_test()
          client.logout()
          if not ok:
              print('::error::Heritage Test smoke test FAILED — login broken after publish. BLOCKING production deploy.')
              sys.exit(1)
          print('Heritage Test smoke test passed — safe to proceed to production')
          "

      - name: Heritage Test gate summary
        if: always()
        run: |
          echo "## Heritage Test Publish Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Validates publish on the production instance Heritage Test tenant" >> "$GITHUB_STEP_SUMMARY"
          echo "before deploying to the production tenant. **Hard gate — failure blocks prod.**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Step | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Deploy | \`${{ steps.deploy.outcome || 'n/a' }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field Validation | \`${{ steps.verify.outcome || 'n/a' }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Smoke Test | \`${{ steps.smoke.outcome || 'n/a' }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| E2E View Smoke | \`${{ steps.e2e.outcome || 'n/a' }}\` |" >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────
  # Job 4: Countdown + Deploy to Production
  # ──────────────────────────────────────────────
  countdown-notify:
    name: Send Maintenance Warnings
    needs: [build, qualify, heritage-test-gate]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.build.result == 'success' &&
      (needs.heritage-test-gate.result == 'success' || needs.heritage-test-gate.result == 'skipped') &&
      github.event_name != 'pull_request' && (
        (needs.qualify.outputs.needs_countdown == 'true' && github.event.inputs.countdown_complete != 'true') ||
        github.event.inputs.force_qualify == 'true' ||
        github.event.inputs.countdown_complete == 'true' ||
        (needs.qualify.result == 'success' && needs.qualify.outputs.needs_countdown != 'true')
      )
    steps:
      - uses: actions/checkout@v4
      - name: Determine target environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ github.event.inputs.environment }}"
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            TARGET="${{ github.event.client_payload.environment || 'production' }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TARGET="production"
          else
            TARGET="staging"
          fi
          echo "target=${TARGET}" >> "$GITHUB_OUTPUT"
          echo "Determined target environment: ${TARGET}"
      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt
      - name: Send 20-minute warning and schedule deploy
        id: snapshot
        if: github.event.inputs.force_qualify != 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.STUDIOB_SLACK_WEBHOOK_URL }}
          ACUMATICA_URL: ${{ secrets.ACUMATICA_PROD_URL }}
          ACUMATICA_USERNAME: ${{ secrets.ACUMATICA_PROD_USERNAME }}
          ACUMATICA_PASSWORD: ${{ secrets.ACUMATICA_PROD_PASSWORD }}
          ACUMATICA_TENANT: ${{ secrets.ACUMATICA_PROD_TENANT }}
        run: |
          python scripts/snapshot.py \
            --project "${PROJECT_NAME}" \
            --output backups/

      - name: Upload pre-deploy snapshot
        if: steps.snapshot.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pre-deploy-snapshot-${{ github.run_number }}
          path: backups/*.zip
          retention-days: 365

      # ── After-hours detection (6pm–6am CT → skip employee emails) ────
      - name: Check if after-hours (6pm-6am CT)
        id: hours
        run: |
          CT_HOUR=$(TZ=America/Chicago date +%H)
          if [ "$CT_HOUR" -ge 18 ] || [ "$CT_HOUR" -lt 6 ]; then
            echo "after_hours=true" >> "$GITHUB_OUTPUT"
            echo "After-hours deploy (${CT_HOUR}:00 CT) — employee emails suppressed"
          else
            echo "after_hours=false" >> "$GITHUB_OUTPUT"
            echo "Business-hours deploy (${CT_HOUR}:00 CT) — employee emails will be sent"
          fi

      # ── Maintenance Mode — pause all Acumatica workers before publish ─
      - name: Enter maintenance mode
        id: smoke
        env:
          ACUMATICA_URL: ${{ (steps.env.outputs.target == 'production') && secrets.ACUMATICA_PROD_URL || secrets.ACUMATICA_SANDBOX_URL }}
          ACUMATICA_USERNAME: ${{ secrets.ACUMATICA_PROD_USERNAME }}
          ACUMATICA_PASSWORD: ${{ secrets.ACUMATICA_PROD_PASSWORD }}
          ACUMATICA_TENANT: ${{ (steps.env.outputs.target == 'production') && secrets.ACUMATICA_PROD_TENANT || secrets.ACUMATICA_SANDBOX_TENANT }}
        run: |
          # Skip smoke test on emergency deploys (force_qualify=true).
          # Use case: Acumatica is DOWN because of a bad customization — we need to
          # deploy the fix even though we cannot log in. deploy.py has its own retry
          # logic that handles TargetInvocationException / API Login Limit.
          if [ "${{ github.event.inputs.force_qualify }}" = "true" ]; then
            echo "::warning::force_qualify=true — skipping pre-deploy smoke test (emergency deploy)"
            exit 0
          fi
          python -c "
          import sys; sys.path.insert(0, '.')
          from scripts.deploy import AcumaticaCustomizationClient
          import os
          client = AcumaticaCustomizationClient(
              os.environ['ACUMATICA_URL'], os.environ['ACUMATICA_USERNAME'],
              os.environ['ACUMATICA_PASSWORD'], os.environ['ACUMATICA_TENANT'],
          )
          client.login()
          ok = client.smoke_test()
          client.logout()
          sys.exit(0 if ok else 1)
          "

      # ── Download built packages ──────────────────────────────────────
      - name: Download package artifacts
        if: success() && github.event.inputs.dry_run != 'true'
        uses: actions/download-artifact@v4
        with:
          name: customization-package
          path: dist/

      # ── DEPLOY — Import + Publish to Acumatica ──────────────────────
      - name: Import and publish customization
        id: deploy
        if: success() && github.event.inputs.dry_run != 'true'
        env:
          ACUMATICA_URL: ${{ (steps.env.outputs.target == 'production') && secrets.ACUMATICA_PROD_URL || secrets.ACUMATICA_SANDBOX_URL }}
          ACUMATICA_USERNAME: ${{ secrets.ACUMATICA_PROD_USERNAME }}
          ACUMATICA_PASSWORD: ${{ secrets.ACUMATICA_PROD_PASSWORD }}
          ACUMATICA_TENANT: ${{ (steps.env.outputs.target == 'production') && secrets.ACUMATICA_PROD_TENANT || secrets.ACUMATICA_SANDBOX_TENANT }}
        run: |
          PACKAGE_FILE=$(ls dist/${PROJECT_NAME}_*.zip 2>/dev/null | head -1)
          if [ -z "${PACKAGE_FILE}" ]; then
            echo "::error::No package found in dist/ for ${PROJECT_NAME}"
            exit 1
          fi

          # Build extra import flags for co-managed packages
          EXTRA_FLAGS=""
          for pkg in dist/*.zip; do
            if [ "${pkg}" != "${PACKAGE_FILE}" ]; then
              PKG_BASE=$(basename "${pkg}" .zip)
              PKG_NAME=$(echo "${PKG_BASE}" | sed 's/_[0-9]\{8\}-[0-9]\{6\}$//')
              EXTRA_FLAGS+=" --extra-import ${PKG_NAME}:${pkg}"
            fi
          done

          echo "Deploying ${PACKAGE_FILE} to ${{ steps.env.outputs.target }}"

          # Emergency path: use basic auth when session login is broken
          if [ "${{ github.event.inputs.force_qualify }}" = "true" ]; then
            echo "::warning::force_qualify=true — using basic auth emergency deploy (bypasses broken session login)"
            # Unzip package to temp dir for the emergency script
            mkdir -p /tmp/emergency-pkg
            unzip -o "${PACKAGE_FILE}" -d /tmp/emergency-pkg/

            # Also unzip extra packages
            for pkg in dist/*.zip; do
              if [ "${pkg}" != "${PACKAGE_FILE}" ]; then
                PKG_BASE=$(basename "${pkg}" .zip)
                PKG_NAME=$(echo "${PKG_BASE}" | sed 's/_[0-9]\{8\}-[0-9]\{6\}$//')
                mkdir -p "/tmp/extra-${PKG_NAME}"
                unzip -o "${pkg}" -d "/tmp/extra-${PKG_NAME}/"
                # Import only — do NOT publish individually. A single publishBegin
                # at the end includes ALL projects. Publishing extras one-by-one
                # would set the instance published list to just that one project,
                # unpublishing every ISV. See: 2026-04-01 ISV unpublish incident.
                PACKAGE_DIR="/tmp/extra-${PKG_NAME}" PROJECT_NAME="${PKG_NAME}" \
                  IMPORT_ONLY=true \
                  python scripts/emergency-deploy-basic-auth.py
              fi
            done

            PACKAGE_DIR=/tmp/emergency-pkg PROJECT_NAME="${PROJECT_NAME}" \
              ALSO_PUBLISH_PROJECTS="${ALSO_PUBLISH}" \
              python scripts/emergency-deploy-basic-auth.py
          else
            python scripts/deploy.py \
              --project "${PROJECT_NAME}" \
              --package "${PACKAGE_FILE}" \
              --also-publish "${ALSO_PUBLISH}" \
              ${EXTRA_FLAGS}
          fi

      # ── Post-publish field validation ────────────────────────────────
      - name: Post-publish field validation
        id: verify
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        env:
          ACUMATICA_URL: ${{ (steps.env.outputs.target == 'production') && secrets.ACUMATICA_PROD_URL || secrets.ACUMATICA_SANDBOX_URL }}
          ACUMATICA_USERNAME: ${{ secrets.ACUMATICA_PROD_USERNAME }}
          ACUMATICA_PASSWORD: ${{ secrets.ACUMATICA_PROD_PASSWORD }}
          ACUMATICA_TENANT: ${{ (steps.env.outputs.target == 'production') && secrets.ACUMATICA_PROD_TENANT || secrets.ACUMATICA_SANDBOX_TENANT }}
        run: python scripts/validate-publish.py --manifest publish-manifest.json

      - name: E2E view-level smoke test
        id: e2e
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        env:
          ACUMATICA_URL: ${{ (steps.env.outputs.target == 'production') && secrets.ACUMATICA_PROD_URL || secrets.ACUMATICA_SANDBOX_URL }}
          ACUMATICA_USERNAME: ${{ secrets.ACUMATICA_PROD_USERNAME }}
          ACUMATICA_PASSWORD: ${{ secrets.ACUMATICA_PROD_PASSWORD }}
          ACUMATICA_TENANT: ${{ (steps.env.outputs.target == 'production') && secrets.ACUMATICA_PROD_TENANT || secrets.ACUMATICA_SANDBOX_TENANT }}
        run: python scripts/smoke-e2e.py --manifest publish-manifest.json

      # ── Auto-rollback on verification failure ─────────────────────────
      - name: Auto-rollback on verification failure
        id: rollback
        if: |
          steps.deploy.outcome == 'success' &&
          (steps.verify.outcome == 'failure' || steps.e2e.outcome == 'failure') &&
          steps.env.outputs.target == 'production' &&
          github.event.inputs.dry_run != 'true'
        env:
          ACUMATICA_URL: ${{ secrets.ACUMATICA_PROD_URL }}
          ACUMATICA_USERNAME: ${{ secrets.ACUMATICA_PROD_USERNAME }}
          ACUMATICA_PASSWORD: ${{ secrets.ACUMATICA_PROD_PASSWORD }}
          ACUMATICA_TENANT: ${{ secrets.ACUMATICA_PROD_TENANT }}
          SLACK_WEBHOOK_URL: ${{ secrets.STUDIOB_SLACK_WEBHOOK_URL }}
        run: |
          SNAPSHOT=$(ls backups/${PROJECT_NAME}_backup_*.zip 2>/dev/null | head -1)
          if [ -z "${SNAPSHOT}" ]; then
            echo "::error::No snapshot available — cannot rollback"
            curl -sf -X POST "${SLACK_WEBHOOK_URL}" \
              -H "Content-Type: application/json" \
              -d '{"text":"ROLLBACK FAILED — no snapshot available\nDeploy: '"${PROJECT_NAME}"' @ '"${GITHUB_SHA::8}"'\nManual restore required via SM204505"}'
            exit 1
          fi

          echo "Rolling back to snapshot: ${SNAPSHOT}"
          python scripts/deploy.py \
            --project "${PROJECT_NAME}" \
            --package "${SNAPSHOT}" \
            --also-publish "${ALSO_PUBLISH}"

          # Post-rollback verification
          python scripts/validate-publish.py --manifest publish-manifest.json
          ROLLBACK_VERIFY=$?

          if [ ${ROLLBACK_VERIFY} -eq 0 ]; then
            curl -sf -X POST "${SLACK_WEBHOOK_URL}" \
              -H "Content-Type: application/json" \
              -d '{"text":"Deploy ROLLED BACK — '"${PROJECT_NAME}"' -> production\nDeploy: '"${GITHUB_SHA::8}"'\nRollback: snapshot restored + verified\nNote: two app pool restarts occurred"}'
          else
            curl -sf -X POST "${SLACK_WEBHOOK_URL}" \
              -H "Content-Type: application/json" \
              -d '{"text":"ROLLBACK FAILED — verification did not pass\nDeploy: '"${PROJECT_NAME}"' @ '"${GITHUB_SHA::8}"'\nArtifact: '"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"'\nManual restore: download artifact -> SM204505 Import -> Publish"}'
            exit 1
          fi

      - name: Tag rolled-back deploy
        if: steps.rollback.outcome == 'success'
        run: |
          TAG="deploy/prod/$(date +%Y%m%d-%H%M%S)-ROLLED-BACK"
          git tag "${TAG}"
          git push origin "${TAG}"

      # ── Exit maintenance mode — resume all Acumatica workers ──────────
      - name: Exit maintenance mode
        if: always() && steps.env.outputs.target == 'production' && github.event.inputs.dry_run != 'true'
        continue-on-error: true
        env:
          REGRESSION_WEBHOOK_URL: ${{ secrets.REGRESSION_WEBHOOK_URL || 'https://webhook-router-production-e161.up.railway.app' }}
          REGRESSION_WEBHOOK_SECRET: ${{ secrets.REGRESSION_WEBHOOK_SECRET }}
        run: |
          if [ -z "${REGRESSION_WEBHOOK_SECRET}" ]; then
            echo "REGRESSION_WEBHOOK_SECRET not set — skipping regression tests"
            exit 0
          fi
          TARGET="${{ steps.env.outputs.target }}"
          COMMIT="${{ github.sha }}"
          RESPONSE=$(curl -sf -X POST "${REGRESSION_WEBHOOK_URL}/api/regression/trigger" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: ${REGRESSION_WEBHOOK_SECRET}" \
            -d "{\"environment\": \"${TARGET}\", \"deployCommit\": \"${COMMIT}\", \"trigger\": \"post-deploy\"}" \
            --max-time 10 || true)
          echo "Regression trigger response: ${RESPONSE}"
          if echo "${RESPONSE}" | grep -q '"ok":true'; then
            RUN_ID=$(echo "${RESPONSE}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('runId','unknown'))" 2>/dev/null || echo "unknown")
            echo "run_id=${RUN_ID}" >> $GITHUB_OUTPUT
            echo "Regression tests triggered (runId: ${RUN_ID})"
          else
            echo "Regression trigger failed or not configured — continuing deploy"
          fi

      # ── Post-deploy notifications ─────────────────────────────────────
      - name: Notify system back online
        if: success() && steps.env.outputs.target == 'production'
        continue-on-error: true
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SLACK_WEBHOOK_URL: ${{ secrets.STUDIOB_SLACK_WEBHOOK_URL }}
          NOTIFY_RECIPIENTS: ${{ vars.MAINTENANCE_NOTIFY_RECIPIENTS }}
          NOTIFY_SENDER: ${{ vars.MAINTENANCE_NOTIFY_SENDER || 'kevin@heritagefabrics.com' }}
        run: |
          python scripts/notify.py \
            --type online \
            --recipients "${NOTIFY_RECIPIENTS}" \
            --sender "${NOTIFY_SENDER}" \
            --project "${PROJECT_NAME}" \
            --environment "${{ steps.env.outputs.target }}" \
            --slack-webhook "${SLACK_WEBHOOK_URL}" \
            ${{ steps.hours.outputs.after_hours == 'true' && '--skip-email' || '' }}

      - name: Notify deploy failed
        if: failure() && steps.env.outputs.target == 'production'
        continue-on-error: true
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SLACK_WEBHOOK_URL: ${{ secrets.STUDIOB_SLACK_WEBHOOK_URL }}
          NOTIFY_RECIPIENTS: ${{ vars.MAINTENANCE_NOTIFY_RECIPIENTS }}
          NOTIFY_SENDER: ${{ vars.MAINTENANCE_NOTIFY_SENDER || 'kevin@heritagefabrics.com' }}
        run: |
          python scripts/notify.py \
            --type failed \
            --recipients "${NOTIFY_RECIPIENTS}" \
            --sender "${NOTIFY_SENDER}" \
            --project "${PROJECT_NAME}" \
            --environment "${{ steps.env.outputs.target }}" \
            --slack-webhook "${SLACK_WEBHOOK_URL}" \
            ${{ steps.hours.outputs.after_hours == 'true' && '--skip-email' || '' }}

      # ── Auto-lockout on deploy failure (AAR 2026-03-28 Guard 5) ──────
      # Prevents Railway services from hammering a broken Acumatica instance
      # while the deploy failure is being investigated.
      - name: Auto-lockout on deploy failure
        if: failure() && steps.deploy.outcome == 'failure' && steps.env.outputs.target == 'production'
        continue-on-error: true
        run: |
          LOCKOUT_URL="https://webhook-router-production-e161.up.railway.app"
          curl -sf -X POST "${LOCKOUT_URL}/maintenance/start" \
            -H "Content-Type: application/json" \
            -d '{"ttl": 3600, "reason": "Auto-lockout: CI/CD deploy failed — preventing retry storm"}' \
            --max-time 5 || echo "Lockout endpoint unreachable — manual lockout may be needed"
          echo "::warning::Auto-lockout enabled for 1 hour. Clear with POST /maintenance/end when resolved."

      # Notify Slack on deploy failure
      - name: Slack notification on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.STUDIOB_SLACK_WEBHOOK_URL }}
        run: |
          TARGET="${{ steps.env.outputs.target }}"
          if [ -n "${SLACK_WEBHOOK_URL}" ]; then
            curl -s -X POST "${SLACK_WEBHOOK_URL}" \
              -H "Content-Type: application/json" \
              -d "{\"text\":\":x: *Acumatica Customization Deploy FAILED*\nProject: \`${PROJECT_NAME}\`\nEnvironment: \`${TARGET}\`\nCommit: \`${GITHUB_SHA::8}\`\nActor: @${GITHUB_ACTOR}\nRun: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\n:lock: Auto-lockout enabled (1 hour)\"}"
          fi

      - name: Post deployment summary
        if: always()
        run: |
          TARGET="${{ steps.env.outputs.target }}"
          echo "## Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | \`${TARGET}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Project | \`${PROJECT_NAME}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Package | \`${{ needs.build.outputs.package_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${GITHUB_SHA::8}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Actor | @${GITHUB_ACTOR} |" >> "$GITHUB_STEP_SUMMARY"
          SNAPSHOT_FILES=$(ls backups/*.zip 2>/dev/null | xargs -I{} basename {} | tr '\n' ', ' || echo "N/A")
          echo "| Snapshot | ${SNAPSHOT_FILES:-N/A} |" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${TARGET}" == "production" && "${{ github.event.inputs.skip_countdown }}" != "true" && "${{ github.event.inputs.dry_run }}" != "true" ]]; then
            echo "| Countdown | 20-5-1 min warnings sent |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Countdown | Skipped |" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Tag successful deploy
        if: success() && steps.env.outputs.target == 'production'
        run: |
          TAG="deploy/prod/$(date +%Y%m%d-%H%M%S)"
          git tag "${TAG}"
          git push origin "${TAG}"
          echo "Tagged: ${TAG}"

  # ──────────────────────────────────────────────
  # Job 4: Sandbox Validate — full publish + verify on sandbox (PR only)
  # ──────────────────────────────────────────────
  sandbox-validate:
    name: Validate on Sandbox
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    continue-on-error: true
    concurrency:
      group: sandbox-publish
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: customization-package
          path: dist/

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Import and publish on sandbox
        env:
          ACUMATICA_URL: ${{ secrets.ACUMATICA_SANDBOX_URL }}
          ACUMATICA_USERNAME: ${{ secrets.ACUMATICA_PROD_USERNAME }}
          ACUMATICA_PASSWORD: ${{ secrets.ACUMATICA_PROD_PASSWORD }}
          ACUMATICA_TENANT: ${{ secrets.ACUMATICA_SANDBOX_TENANT }}
        run: |
          PACKAGE_FILE=$(ls dist/${PROJECT_NAME}_*.zip 2>/dev/null | head -1)
          if [ -z "${PACKAGE_FILE}" ]; then
            PACKAGE_FILE=$(ls dist/*.zip | head -1)
          fi

          EXTRA_FLAGS=""
          SANDBOX_COPUBLISH=""
          for pkg in dist/*.zip; do
            if [ "${pkg}" != "${PACKAGE_FILE}" ]; then
              PKG_BASE=$(basename "${pkg}" .zip)
              PKG_NAME=$(echo "${PKG_BASE}" | sed 's/_[0-9]\{8\}-[0-9]\{6\}$//')
              EXTRA_FLAGS+=" --extra-import ${PKG_NAME}:${pkg}"
              if [ -n "${SANDBOX_COPUBLISH}" ]; then
                SANDBOX_COPUBLISH+=",${PKG_NAME}"
              else
                SANDBOX_COPUBLISH="${PKG_NAME}"
              fi
            fi
          done

          # Sandbox only co-publishes extra packages we just imported —
          # deploy.py prepends PROJECT_NAME automatically, so don't include it here.
          # No ISV/vendor packages, no projects not in test company.
          python scripts/deploy.py \
            --project "${PROJECT_NAME}" \
            --package "${PACKAGE_FILE}" \
            --also-publish "${SANDBOX_COPUBLISH}" \
            --pre-cleanup \
            ${EXTRA_FLAGS}

      - name: Validate custom fields on sandbox
        id: verify
        env:
          ACUMATICA_URL: ${{ secrets.ACUMATICA_SANDBOX_URL }}
          ACUMATICA_USERNAME: ${{ secrets.ACUMATICA_PROD_USERNAME }}
          ACUMATICA_PASSWORD: ${{ secrets.ACUMATICA_PROD_PASSWORD }}
          ACUMATICA_TENANT: ${{ secrets.ACUMATICA_SANDBOX_TENANT }}
        run: |
          python scripts/validate-publish.py \
            --manifest publish-manifest.json \
            2>&1 | tee validation-output.txt

      - name: E2E view-level smoke test
        id: e2e
        env:
          ACUMATICA_URL: ${{ secrets.ACUMATICA_SANDBOX_URL }}
          ACUMATICA_USERNAME: ${{ secrets.ACUMATICA_PROD_USERNAME }}
          ACUMATICA_PASSWORD: ${{ secrets.ACUMATICA_PROD_PASSWORD }}
          ACUMATICA_TENANT: ${{ secrets.ACUMATICA_SANDBOX_TENANT }}
        run: |
          python scripts/smoke-e2e.py --manifest publish-manifest.json \
            2>&1 | tee e2e-output.txt

      - name: Comment on PR with results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RESULT="Passed"
          if [ "${{ steps.verify.outcome }}" = "failure" ] || [ "${{ steps.e2e.outcome }}" = "failure" ]; then
            RESULT="Failed"
          fi

          BODY=""
          if [ -f validation-output.txt ]; then
            BODY=$(cat validation-output.txt | head -50)
          fi

          gh pr comment ${{ github.event.pull_request.number }} --body "### Sandbox Validation ${RESULT}

          \`\`\`
          ${BODY}
          \`\`\`

          [Full run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"

      - name: Post validation summary
        if: always()
        run: |
          echo "## Sandbox Validation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f validation-output.txt ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            head -50 validation-output.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

  # ──────────────────────────────────────────────
  # Job 5: Post-Deploy Validation — run UI tests from tests/ui/
  # ──────────────────────────────────────────────
  post-deploy-validation:
    name: Trigger Runtime Tests
    needs: countdown-notify
    runs-on: ubuntu-latest
    if: needs.countdown-notify.result == 'success' && github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          pip install playwright pytest
          playwright install chromium

      - name: Run UI tests
        env:
          ACUMATICA_URL: ${{ secrets.ACUMATICA_URL }}
          ACUMATICA_USERNAME: ${{ secrets.ACUMATICA_USERNAME }}
          ACUMATICA_PASSWORD: ${{ secrets.ACUMATICA_PASSWORD }}
          ACUMATICA_TENANT: ${{ vars.ACUMATICA_TEST_TENANT }}
        run: |
          python -m pytest tests/ui/ -v --tb=long --timeout=120 || {
            echo "::warning::UI tests failed — see logs above for details"
            exit 1
          }
