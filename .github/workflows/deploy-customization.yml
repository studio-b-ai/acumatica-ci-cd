# Acumatica Customization CI/CD Pipeline
# Deploys customization projects via the Customization API
#
# Triggers:
#   - Push to main     → Deploy to PRODUCTION
#   - Push to staging   → Deploy to STAGING
#   - Pull request      → Validate against STAGING (no publish)
#   - Manual dispatch   → Choose target environment
#
# Required GitHub Secrets (per environment):
#   ACUMATICA_PROD_URL        - Production instance URL
#   ACUMATICA_PROD_USERNAME   - Production API user
#   ACUMATICA_PROD_PASSWORD   - Production API password
#   ACUMATICA_PROD_TENANT     - Production tenant name
#   ACUMATICA_STG_*           - Staging equivalents (same instance, test company)
#
# Required GitHub Variables:
#   CUSTOMIZATION_PROJECT_NAME      - Name of the customization project in Acumatica
#   ALSO_PUBLISH_PROJECTS           - Comma-separated list of other active projects to co-publish
#                                     (VAR packages, Shopify connector, etc.) for conflict detection
#   MAINTENANCE_NOTIFY_RECIPIENTS   - Comma-separated emails for maintenance countdown notifications
#   MAINTENANCE_NOTIFY_SENDER       - Sender email for notifications (default: kevin@heritagefabrics.com)
#
# Optional GitHub Secrets (for email notifications via Microsoft Graph API):
#   AZURE_TENANT_ID       - Entra tenant ID
#   AZURE_CLIENT_ID       - Entra app client ID (Mail.Send permission required)
#   AZURE_CLIENT_SECRET   - Entra app client secret

name: Deploy Acumatica Customization

# ━━━ CONCURRENCY CONTROL ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Acumatica publishes restart the app pool and recompile ALL customization
# projects. Overlapping publishes can corrupt the runtime state.
# Only ONE deploy may run per branch at a time. If a new push arrives while
# a deploy is in progress, the in-progress run is cancelled.
# See: AAR-2026-03-18-acumatica-outage.md
concurrency:
  group: acumatica-deploy-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, staging]
    paths:
      - 'Customization/**'
      - 'scripts/deploy.sh'
      - 'scripts/deploy.py'
      - 'scripts/validate-project.py'
      - 'scripts/validate-publish.py'
      - 'scripts/snapshot.py'
      - 'scripts/notify.py'
      - '.github/workflows/deploy-customization.yml'
  pull_request:
    branches: [main, staging]
    paths:
      - 'Customization/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
      dry_run:
        description: 'Validate only (no publish)'
        required: false
        type: boolean
        default: false
      skip_countdown:
        description: 'Emergency deploy — skip 20-min countdown (still takes snapshot)'
        required: false
        type: boolean
        default: false

env:
  PROJECT_NAME: ${{ vars.CUSTOMIZATION_PROJECT_NAME || 'AesthetikERP' }}
  ALSO_PUBLISH: ${{ vars.ALSO_PUBLISH_PROJECTS || '' }}

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Build — Package customization into .zip
  # ──────────────────────────────────────────────
  build:
    name: Build Customization Package
    runs-on: ubuntu-latest
    outputs:
      package_path: ${{ steps.package.outputs.path }}
      package_name: ${{ steps.package.outputs.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate project.xml
        run: |
          python scripts/validate-project.py Customization/AesthetikERP/project.xml
          # Production deploys run strict mode — unsafe extension patterns become errors
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "Running strict validation for production..."
            python scripts/validate-project.py --strict Customization/AesthetikERP/project.xml
          fi

      - name: Check for C# extension library
        id: check_csproj
        run: |
          if ls Customization/*.csproj 1>/dev/null 2>&1; then
            echo "has_csproj=true" >> "$GITHUB_OUTPUT"
            echo "Found C# project — will build extension library"
          else
            echo "has_csproj=false" >> "$GITHUB_OUTPUT"
            echo "No C# project — packaging XML/ASPX only"
          fi

      - name: Setup .NET (if C# extension exists)
        if: steps.check_csproj.outputs.has_csproj == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Build C# extension library
        if: steps.check_csproj.outputs.has_csproj == 'true'
        run: |
          cd Customization
          dotnet restore
          dotnet build --configuration Release --no-restore
          echo "Extension library built successfully"

      - name: Package customization project
        id: package
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          PACKAGE_NAME="${PROJECT_NAME}_${TIMESTAMP}.zip"
          PACKAGE_PATH="dist/${PACKAGE_NAME}"

          mkdir -p dist

          cd Customization/AesthetikERP
          zip -r "../../${PACKAGE_PATH}" . \
            -x "*.DS_Store" \
            -x "__MACOSX/*" \
            -x "*.user" \
            -x "bin/*" \
            -x "obj/*"
          cd ../..

          # Include compiled DLLs if they exist
          if [ -d "Customization/bin/Release" ]; then
            cd Customization/bin/Release
            zip -ur "../../../${PACKAGE_PATH}" *.dll 2>/dev/null || true
            cd ../../..
          fi

          FILESIZE=$(du -h "${PACKAGE_PATH}" | cut -f1)
          echo "Packaged: ${PACKAGE_NAME} (${FILESIZE})"

          echo "path=${PACKAGE_PATH}" >> "$GITHUB_OUTPUT"
          echo "name=${PACKAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: customization-package
          path: dist/*.zip
          retention-days: 30

  # ──────────────────────────────────────────────
  # Job 2: Deploy — Push to Acumatica instance
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    environment:
      name: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: customization-package
          path: dist/

      - name: Resolve environment
        id: env
        run: |
          if [[ "${{ github.event.inputs.environment }}" == "production" ]] || [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "target=production" >> "$GITHUB_OUTPUT"
          else
            echo "target=staging" >> "$GITHUB_OUTPUT"
          fi

      # ── Pre-deploy snapshot ─────────────────────────────────────────────
      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Pre-deploy snapshot
        id: snapshot
        if: steps.env.outputs.target == 'production' && github.event.inputs.dry_run != 'true'
        continue-on-error: true
        env:
          ACUMATICA_URL: ${{ secrets.ACUMATICA_PROD_URL }}
          ACUMATICA_USERNAME: ${{ secrets.ACUMATICA_PROD_USERNAME }}
          ACUMATICA_PASSWORD: ${{ secrets.ACUMATICA_PROD_PASSWORD }}
          ACUMATICA_TENANT: ${{ secrets.ACUMATICA_PROD_TENANT }}
        run: |
          python scripts/snapshot.py \
            --project "${PROJECT_NAME}" \
            --output backups/

      - name: Upload pre-deploy snapshot
        if: steps.snapshot.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pre-deploy-snapshot-${{ github.run_number }}
          path: backups/*.zip
          retention-days: 90

      # ── After-hours detection (6pm–6am CT → skip employee emails) ────
      - name: Check if after-hours (6pm-6am CT)
        id: hours
        run: |
          CT_HOUR=$(TZ=America/Chicago date +%H)
          if [ "$CT_HOUR" -ge 18 ] || [ "$CT_HOUR" -lt 6 ]; then
            echo "after_hours=true" >> "$GITHUB_OUTPUT"
            echo "After-hours deploy (${CT_HOUR}:00 CT) — employee emails suppressed"
          else
            echo "after_hours=false" >> "$GITHUB_OUTPUT"
            echo "Business-hours deploy (${CT_HOUR}:00 CT) — employee emails will be sent"
          fi

      # ── Maintenance countdown (production only, business hours only) ─
      - name: Maintenance countdown notifications
        if: |
          steps.env.outputs.target == 'production' &&
          github.event.inputs.skip_countdown != 'true' &&
          github.event.inputs.dry_run != 'true' &&
          steps.hours.outputs.after_hours != 'true'
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SLACK_WEBHOOK_URL: ${{ secrets.STUDIOB_SLACK_WEBHOOK_URL }}
          NOTIFY_RECIPIENTS: ${{ vars.MAINTENANCE_NOTIFY_RECIPIENTS }}
          NOTIFY_SENDER: ${{ vars.MAINTENANCE_NOTIFY_SENDER || 'kevin@heritagefabrics.com' }}
        run: |
          # 20-minute warning
          echo "::group::Sending 20-minute warning"
          python scripts/notify.py --type countdown --minutes 20 \
            --recipients "${NOTIFY_RECIPIENTS}" \
            --sender "${NOTIFY_SENDER}" \
            --project "${PROJECT_NAME}" \
            --environment "${{ steps.env.outputs.target }}" \
            --slack-webhook "${SLACK_WEBHOOK_URL}" || true
          echo "::endgroup::"

          echo "Waiting 15 minutes..."
          sleep 900

          # 5-minute warning
          echo "::group::Sending 5-minute warning"
          python scripts/notify.py --type countdown --minutes 5 \
            --recipients "${NOTIFY_RECIPIENTS}" \
            --sender "${NOTIFY_SENDER}" \
            --project "${PROJECT_NAME}" \
            --environment "${{ steps.env.outputs.target }}" \
            --slack-webhook "${SLACK_WEBHOOK_URL}" || true
          echo "::endgroup::"

          echo "Waiting 4 minutes..."
          sleep 240

          # 1-minute warning
          echo "::group::Sending 1-minute warning"
          python scripts/notify.py --type countdown --minutes 1 \
            --recipients "${NOTIFY_RECIPIENTS}" \
            --sender "${NOTIFY_SENDER}" \
            --project "${PROJECT_NAME}" \
            --environment "${{ steps.env.outputs.target }}" \
            --slack-webhook "${SLACK_WEBHOOK_URL}" || true
          echo "::endgroup::"

          echo "Final wait — 60 seconds..."
          sleep 60
          echo "Countdown complete — proceeding to deploy"

      # ── Maintenance Mode — pause all Acumatica workers before publish ─
      - name: Enter maintenance mode
        if: steps.env.outputs.target == 'production' && github.event.inputs.dry_run != 'true'
        env:
          WEBHOOK_ROUTER_URL: https://webhook-router-production-e161.up.railway.app
          PROVISION_API_KEY: ${{ secrets.PROVISION_API_KEY }}
        run: |
          echo "Setting maintenance mode on webhook-router..."
          HTTP_CODE=$(curl -s -o /tmp/maint-response.json -w "%{http_code}" \
            -X POST "${WEBHOOK_ROUTER_URL}/maintenance/start" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${PROVISION_API_KEY}" \
            -d '{"reason":"Acumatica customization publish — app pool restart expected","ttl_seconds":3600}')
          if [ "${HTTP_CODE}" = "200" ]; then
            echo "✅ Maintenance mode active — all Acumatica workers paused"
            cat /tmp/maint-response.json
          else
            echo "⚠️ Could not set maintenance mode (HTTP ${HTTP_CODE}) — continuing anyway"
            cat /tmp/maint-response.json 2>/dev/null || true
          fi

      # ── Deploy ───────────────────────────────────────────────────────
      # Pass secrets directly as env vars — never write them to GITHUB_OUTPUT
      - name: Deploy customization via REST API
        env:
          ACUMATICA_URL: ${{ (steps.env.outputs.target == 'production') && secrets.ACUMATICA_PROD_URL || (secrets.ACUMATICA_STG_URL || secrets.ACUMATICA_PROD_URL) }}
          ACUMATICA_USERNAME: ${{ (steps.env.outputs.target == 'production') && secrets.ACUMATICA_PROD_USERNAME || (secrets.ACUMATICA_STG_USERNAME || secrets.ACUMATICA_PROD_USERNAME) }}
          ACUMATICA_PASSWORD: ${{ (steps.env.outputs.target == 'production') && secrets.ACUMATICA_PROD_PASSWORD || (secrets.ACUMATICA_STG_PASSWORD || secrets.ACUMATICA_PROD_PASSWORD) }}
          ACUMATICA_TENANT: ${{ (steps.env.outputs.target == 'production') && secrets.ACUMATICA_PROD_TENANT || (secrets.ACUMATICA_STG_TENANT || secrets.ACUMATICA_PROD_TENANT) }}
          SLACK_WEBHOOK_URL: ${{ secrets.STUDIOB_SLACK_WEBHOOK_URL }}
        run: |
          # Main package is the one matching PROJECT_NAME; extras are everything else
          PACKAGE_FILE=$(ls dist/${PROJECT_NAME}_*.zip 2>/dev/null | head -1)
          if [ -z "${PACKAGE_FILE}" ]; then
            PACKAGE_FILE=$(ls dist/*.zip | head -1)
          fi
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"

          # Build extra-import flags for any additional packages (name:path format)
          EXTRA_FLAGS=""
          for pkg in dist/*.zip; do
            if [ "${pkg}" != "${PACKAGE_FILE}" ]; then
              # Extract project name by removing timestamp suffix (_YYYYMMDD-HHMMSS.zip)
              PKG_BASE=$(basename "${pkg}" .zip)
              PKG_NAME=$(echo "${PKG_BASE}" | sed 's/_[0-9]\{8\}-[0-9]\{6\}$//')
              EXTRA_FLAGS+=" --extra-import ${PKG_NAME}:${pkg}"
            fi
          done

          chmod +x scripts/deploy.sh
          scripts/deploy.sh \
            --project "${PROJECT_NAME}" \
            --package "${PACKAGE_FILE}" \
            --also-publish "${ALSO_PUBLISH}" \
            --backup \
            --manifest publish-manifest.json \
            ${EXTRA_FLAGS} \
            $( [[ "${DRY_RUN}" == "true" ]] && echo "--validate-only" )

      - name: Upload backup artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customization-backup
          path: dist/backup/*.zip
          retention-days: 30
          if-no-files-found: ignore

      # ── Exit maintenance mode — resume all Acumatica workers ──────────
      - name: Exit maintenance mode
        if: always() && steps.env.outputs.target == 'production' && github.event.inputs.dry_run != 'true'
        continue-on-error: true
        env:
          WEBHOOK_ROUTER_URL: https://webhook-router-production-e161.up.railway.app
          PROVISION_API_KEY: ${{ secrets.PROVISION_API_KEY }}
        run: |
          echo "Clearing maintenance mode..."
          HTTP_CODE=$(curl -s -o /tmp/maint-end.json -w "%{http_code}" \
            -X POST "${WEBHOOK_ROUTER_URL}/maintenance/end" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${PROVISION_API_KEY}")
          if [ "${HTTP_CODE}" = "200" ]; then
            echo "✅ Maintenance mode cleared — workers resuming"
          else
            echo "⚠️ Could not clear maintenance mode (HTTP ${HTTP_CODE}) — TTL will auto-expire"
          fi

      # ── Post-deploy notifications ─────────────────────────────────────
      - name: Notify system back online
        if: success() && steps.env.outputs.target == 'production'
        continue-on-error: true
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SLACK_WEBHOOK_URL: ${{ secrets.STUDIOB_SLACK_WEBHOOK_URL }}
          NOTIFY_RECIPIENTS: ${{ vars.MAINTENANCE_NOTIFY_RECIPIENTS }}
          NOTIFY_SENDER: ${{ vars.MAINTENANCE_NOTIFY_SENDER || 'kevin@heritagefabrics.com' }}
        run: |
          python scripts/notify.py \
            --type online \
            --recipients "${NOTIFY_RECIPIENTS}" \
            --sender "${NOTIFY_SENDER}" \
            --project "${PROJECT_NAME}" \
            --environment "${{ steps.env.outputs.target }}" \
            --slack-webhook "${SLACK_WEBHOOK_URL}" \
            ${{ steps.hours.outputs.after_hours == 'true' && '--skip-email' || '' }}

      - name: Notify deploy failed
        if: failure() && steps.env.outputs.target == 'production'
        continue-on-error: true
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SLACK_WEBHOOK_URL: ${{ secrets.STUDIOB_SLACK_WEBHOOK_URL }}
          NOTIFY_RECIPIENTS: ${{ vars.MAINTENANCE_NOTIFY_RECIPIENTS }}
          NOTIFY_SENDER: ${{ vars.MAINTENANCE_NOTIFY_SENDER || 'kevin@heritagefabrics.com' }}
        run: |
          python scripts/notify.py \
            --type failed \
            --recipients "${NOTIFY_RECIPIENTS}" \
            --sender "${NOTIFY_SENDER}" \
            --project "${PROJECT_NAME}" \
            --environment "${{ steps.env.outputs.target }}" \
            --slack-webhook "${SLACK_WEBHOOK_URL}" \
            ${{ steps.hours.outputs.after_hours == 'true' && '--skip-email' || '' }}

      # Notify Slack on deploy failure
      - name: Slack notification on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.STUDIOB_SLACK_WEBHOOK_URL }}
        run: |
          TARGET="${{ steps.env.outputs.target }}"
          if [ -n "${SLACK_WEBHOOK_URL}" ]; then
            curl -s -X POST "${SLACK_WEBHOOK_URL}" \
              -H "Content-Type: application/json" \
              -d "{\"text\":\":x: *Acumatica Customization Deploy FAILED*\nProject: \`${PROJECT_NAME}\`\nEnvironment: \`${TARGET}\`\nCommit: \`${GITHUB_SHA::8}\`\nActor: @${GITHUB_ACTOR}\nRun: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
          fi

      - name: Notify auto-remediation
        if: failure() && github.ref == 'refs/heads/main'
        env:
          WEBHOOK_ROUTER_URL: ${{ secrets.WEBHOOK_ROUTER_URL }}
        run: |
          if [ -z "${WEBHOOK_ROUTER_URL}" ]; then
            echo "::warning::WEBHOOK_ROUTER_URL not set — skipping auto-remediation"
            exit 0
          fi
          curl -sf -X POST "${WEBHOOK_ROUTER_URL}/webhook/github/ci-failure" \
            -H "Content-Type: application/json" \
            -d '{"repo":"${{ github.repository }}","runId":${{ github.run_id }},"sha":"${{ github.sha }}","branch":"${{ github.ref_name }}"}'
        continue-on-error: true

      - name: Post deployment summary
        if: always()
        run: |
          TARGET="${{ steps.env.outputs.target }}"
          echo "## Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | \`${TARGET}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Project | \`${PROJECT_NAME}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Package | \`${{ needs.build.outputs.package_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${GITHUB_SHA::8}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Actor | @${GITHUB_ACTOR} |" >> "$GITHUB_STEP_SUMMARY"
          SNAPSHOT_FILES=$(ls backups/*.zip 2>/dev/null | xargs -I{} basename {} | tr '\n' ', ' || echo "N/A")
          echo "| Snapshot | ${SNAPSHOT_FILES:-N/A} |" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${TARGET}" == "production" && "${{ github.event.inputs.skip_countdown }}" != "true" && "${{ github.event.inputs.dry_run }}" != "true" ]]; then
            echo "| Countdown | 20-5-1 min warnings sent |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Countdown | Skipped |" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ──────────────────────────────────────────────
  # Job 3: Validate — PR check (no publish)
  # ──────────────────────────────────────────────
  validate:
    name: Validate Against Staging
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: customization-package
          path: dist/

      - name: Validate customization package via REST API
        env:
          ACUMATICA_URL: ${{ secrets.ACUMATICA_STG_URL || secrets.ACUMATICA_PROD_URL }}
          ACUMATICA_USERNAME: ${{ secrets.ACUMATICA_STG_USERNAME || secrets.ACUMATICA_PROD_USERNAME }}
          ACUMATICA_PASSWORD: ${{ secrets.ACUMATICA_STG_PASSWORD || secrets.ACUMATICA_PROD_PASSWORD }}
          ACUMATICA_TENANT: ${{ secrets.ACUMATICA_STG_TENANT || secrets.ACUMATICA_PROD_TENANT }}
        run: |
          PACKAGE_FILE=$(ls dist/${PROJECT_NAME}_*.zip 2>/dev/null | head -1)
          if [ -z "${PACKAGE_FILE}" ]; then
            PACKAGE_FILE=$(ls dist/*.zip | head -1)
          fi

          # Build extra-import flags for any additional packages (name:path format)
          EXTRA_FLAGS=""
          for pkg in dist/*.zip; do
            if [ "${pkg}" != "${PACKAGE_FILE}" ]; then
              # Extract project name by removing timestamp suffix (_YYYYMMDD-HHMMSS.zip)
              PKG_BASE=$(basename "${pkg}" .zip)
              PKG_NAME=$(echo "${PKG_BASE}" | sed 's/_[0-9]\{8\}-[0-9]\{6\}$//')
              EXTRA_FLAGS+=" --extra-import ${PKG_NAME}:${pkg}"
            fi
          done

          chmod +x scripts/deploy.sh
          scripts/deploy.sh \
            --project "${PROJECT_NAME}" \
            --package "${PACKAGE_FILE}" \
            --also-publish "${ALSO_PUBLISH}" \
            ${EXTRA_FLAGS} \
            --validate-only

      - name: Post validation result
        if: always()
        run: |
          echo "## Validation Result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ $? -eq 0 ]; then
            echo "Customization package validated against staging." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Validation failed — check logs above." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ──────────────────────────────────────────────
  # Job 4: Post-Deploy Validation — trigger ui-test-suite
  # ──────────────────────────────────────────────
  post-deploy-validation:
    name: Trigger Runtime Tests
    needs: deploy
    runs-on: ubuntu-latest
    if: needs.deploy.result == 'success' && github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Trigger ui-test-suite
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_DISPATCH }}
        run: |
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::warning::GH_PAT_DISPATCH secret not set — skipping ui-test-suite trigger"
            exit 0
          fi
          gh api repos/studio-b-ai/ui-test-suite/dispatches \
            --method POST \
            -f event_type=post-deploy-validation \
            -f "client_payload[commit]=${GITHUB_SHA::8}" \
            -f "client_payload[project]=${PROJECT_NAME}" \
            -f "client_payload[actor]=${GITHUB_ACTOR}" \
            -f "client_payload[suite]=@write-path"
          echo "Triggered ui-test-suite post-deploy-validation run"

      - name: Dispatch test config for new custom fields
        if: success()
        run: npx tsx scripts/post-publish-hook.ts Customization/AesthetikERP
        env:
          GH_PAT_DISPATCH: ${{ secrets.GH_PAT_DISPATCH }}
