# AcuOps Deploy — Acumatica Customization Deploy Phase
# Called by acuops-build.yml via workflow_call after build + validate + qualify.
# Scripts sourced from studio-b-ai/acuops-pipeline (shared package)
#
# This workflow handles:
#   - Sandbox gate (publish to sandbox + UI tests)
#   - Production/staging deploy (import + publish to Acumatica)
#   - Post-deploy validation
#   - AI failure recovery (invoke-agent)
#
# Required GitHub Secrets (per environment):
#   ACUMATICA_PROD_URL        - Production instance URL
#   ACUMATICA_PROD_USERNAME   - Production API user
#   ACUMATICA_PROD_PASSWORD   - Production API password
#   ACUMATICA_PROD_TENANT     - Production tenant name
#   ACUMATICA_STG_*           - Staging equivalents (optional — falls back to PROD)
#   SLACK_WEBHOOK_URL         - Slack incoming webhook (optional)
#
# Configuration:
#   All project-specific settings are read from acuops.yaml in the repo root.
#   GitHub Variables (CUSTOMIZATION_PROJECT_NAME, ALSO_PUBLISH_PROJECTS) override
#   acuops.yaml values when set.
#
# Pipeline Version:
#   Set ACUOPS_PIPELINE_VERSION GitHub Variable to pin to a specific release
#   (e.g., "v1.2.0"). Defaults to "main" (latest). Heritage stays on main
#   (canary). Commercial clients pin to semver tags for stability.

name: AcuOps Deploy

# ━━━ CONCURRENCY CONTROL ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Acumatica publishes restart the app pool and recompile ALL customization
# projects. Overlapping publishes can corrupt the runtime state.
#
# Only ONE deploy may run per branch at a time. If a new push arrives while
# a deploy is in progress, the new run is QUEUED (not cancelled). Cancelling
# a GitHub Actions run does NOT stop an Acumatica publishEnd that is already
# executing server-side — cancelling mid-publish can leave the instance in a
# half-compiled state. Queue instead, so the first publish finishes cleanly
# before the second begins.
concurrency:
  group: acuops-deploy-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_call:
    inputs:
      package_name:
        type: string
        required: true
      project_name:
        type: string
        required: true
      also_publish:
        type: string
        required: false
        default: ''
      customization_changes:
        type: string
        required: true
      plugin_changes:
        type: string
        required: false
        default: 'false'
      known_projects:
        type: string
        required: false
        default: ''
      isv_packages:
        type: string
        required: false
        default: ''
      isv_prefix:
        type: string
        required: false
        default: ''
      strict:
        type: string
        required: false
        default: 'false'
      environment:
        type: string
        required: true
      force_deploy:
        type: string
        required: false
        default: ''
      skip_sandbox_gate:
        type: string
        required: false
        default: ''
      skip_sandbox_gate_reason:
        type: string
        required: false
        default: ''
      i_really_mean_it:
        type: string
        required: false
        default: ''
      force_business_hours:
        type: string
        required: false
        default: ''
      force_qualify:
        type: string
        required: false
        default: ''
      dry_run:
        type: string
        required: false
        default: ''
      acknowledge_unpublish:
        type: string
        required: false
        default: ''

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  # ──────────────────────────────────────────────
  # Job: Sandbox Publish + UI Tests — hard gate for production
  # ──────────────────────────────────────────────
  sandbox-gate:
    name: Sandbox Publish + UI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Publish to the SANDBOX instance (separate from production — no app pool
    # restart on prod). Run full UI test suite. Hard gate for production deploy.
    #
    # NOTE: force_qualify=true no longer skips this job. force_qualify now
    # only skips the agentic qualify checks and the pre-deploy smoke test
    # (both of which probe the prod instance). sandbox-gate runs against a
    # SEPARATE sandbox instance, so there is no reason to skip it in an
    # emergency — prod being down does not affect the sandbox.
    #
    # The only way to skip sandbox-gate entirely is to set
    # skip_sandbox_gate="OVERRIDE" via workflow_dispatch. Use only when the
    # sandbox instance itself is down (rare).
    if: >
      inputs.customization_changes == 'true' &&
      inputs.skip_sandbox_gate != 'OVERRIDE'
    concurrency:
      # Queue sandbox publishes, never cancel in-flight ones. Cancelling
      # a GH Actions run does not stop the Acumatica publishEnd already
      # executing on the sandbox instance.
      group: sandbox-publish
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
      - name: Checkout AcuOps pipeline
        uses: actions/checkout@v4
        with:
          repository: studio-b-ai/acuops-pipeline
          ref: ${{ vars.ACUOPS_PIPELINE_VERSION || 'main' }}
          path: pipeline
          ssh-key: ${{ secrets.ACUOPS_PIPELINE_DEPLOY_KEY }}

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: customization-package
          path: dist/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          if [ -f pipeline/requirements.txt ]; then
            pip install -r pipeline/requirements.txt
          fi

      # ── Sandbox host assertion ──────────────────────────────────
      # Defense-in-depth: refuse to publish if the SANDBOX_* secrets
      # have been repointed at the prod instance or the prod-instance
      # Heritage Test tenant. Both conditions cause prod app pool
      # restarts (see 2026-04-07 incident).
      - name: Verify SANDBOX secrets point at sandbox host
        env:
          ACUMATICA_URL: ${{ secrets.ACUMATICA_SANDBOX_URL }}
          ACUMATICA_TENANT: ${{ secrets.ACUMATICA_SANDBOX_TENANT }}
        run: |
          set -e
          if [[ -z "${ACUMATICA_URL}" ]]; then
            echo "::error::ACUMATICA_SANDBOX_URL is empty"
            exit 1
          fi
          HOST=$(echo "${ACUMATICA_URL}" | sed -E 's|^https?://||;s|/.*$||')
          if [[ "${HOST}" != *"heritagefabrics-sandbox.acumatica.com"* ]]; then
            echo "::error::ACUMATICA_SANDBOX_URL must point at heritagefabrics-sandbox.acumatica.com (got host: ${HOST})"
            echo "::error::Refusing to publish — would restart the prod app pool. See 2026-04-07 incident."
            exit 1
          fi
          if [[ "${ACUMATICA_TENANT}" == "Heritage Test" ]]; then
            echo "::error::ACUMATICA_SANDBOX_TENANT is 'Heritage Test', which lives on the prod instance"
            echo "::error::Refusing to publish — would restart the prod app pool."
            exit 1
          fi
          echo "[OK] Sandbox host: ${HOST}, tenant: ${ACUMATICA_TENANT}"

      # ── Publish to sandbox ──────────────────────────────────────
      - name: Deploy to sandbox
        id: deploy
        env:
          ACUMATICA_URL: ${{ secrets.ACUMATICA_SANDBOX_URL }}
          ACUMATICA_USERNAME: ${{ secrets.ACUMATICA_SANDBOX_USERNAME }}
          ACUMATICA_PASSWORD: ${{ secrets.ACUMATICA_SANDBOX_PASSWORD }}
          ACUMATICA_TENANT: ${{ secrets.ACUMATICA_SANDBOX_TENANT }}
        run: |
          PROJECT="${{ inputs.project_name }}"
          PACKAGE_FILE=$(ls dist/${PROJECT}_*.zip 2>/dev/null | head -1)
          if [ -z "${PACKAGE_FILE}" ]; then
            PACKAGE_FILE=$(ls dist/*.zip | head -1)
          fi

          EXTRA_FLAGS=""
          for pkg in dist/*.zip; do
            if [ "${pkg}" != "${PACKAGE_FILE}" ]; then
              PKG_BASE=$(basename "${pkg}" .zip)
              PKG_NAME=$(echo "${PKG_BASE}" | sed 's/_[0-9]\{8\}-[0-9]\{6\}$//')
              EXTRA_FLAGS+=" --extra-import ${PKG_NAME}:${pkg}"
            fi
          done

          # Sandbox uses only managed code — no ISV packages.
          # Read sandbox co-publish list from acuops.yaml (same as old test tenant list).
          # Orphan CustProject rows (IIGCONTAINERMGMT, IIGHFContainerMods,
          # AesthetikContainerGIs) that blocked merge=true were cleaned 2026-04-15.
          # --no-merge and --pre-cleanup are no longer needed and cause GI OData
          # de-registration + circuit-breaker trips. See memory/context/gi-odata-deploy-fix.md.
          SANDBOX_ALSO=$(python3 -c "
          import yaml
          with open('acuops.yaml') as f:
            cfg = yaml.safe_load(f)
          items = cfg.get('pipeline', {}).get('also_publish_test', [])
          print(','.join(items))
          " 2>/dev/null || echo "")
          python3 pipeline/scripts/deploy.py \
            --project "${PROJECT}" \
            --package "${PACKAGE_FILE}" \
            --also-publish "${SANDBOX_ALSO}" \
            --skip-smoke-test \
            ${EXTRA_FLAGS}

      - name: Verify sandbox
        id: verify
        continue-on-error: true
        env:
          ACUMATICA_URL: ${{ secrets.ACUMATICA_SANDBOX_URL }}
          ACUMATICA_USERNAME: ${{ secrets.ACUMATICA_VERIFY_USERNAME || secrets.ACUMATICA_SANDBOX_USERNAME }}
          ACUMATICA_PASSWORD: ${{ secrets.ACUMATICA_VERIFY_PASSWORD || secrets.ACUMATICA_SANDBOX_PASSWORD }}
          ACUMATICA_TENANT: ${{ secrets.ACUMATICA_SANDBOX_TENANT }}
        run: |
          python scripts/verify.py \
            --manifest publish-manifest.json \
            --environment sandbox \
            --no-merge-expected acuops.yaml \
            --json-output verify-result.json

      - name: Upload verification result
        if: always() && steps.verify.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: verify-result-sandbox
          path: verify-result.json
          if-no-files-found: ignore

      - name: Gate on verification failures
        if: always() && steps.verify.outcome != 'skipped'
        run: |
          if [ ! -f verify-result.json ]; then
            echo "::warning::verify-result.json not found — skipping gate"
            exit 0
          fi
          FAIL_COUNT=$(python3 -c "
          import json
          d = json.load(open('verify-result.json'))
          fails = [c for c in d.get('checks', []) if c['status'] == 'fail']
          print(len(fails))
          " 2>/dev/null || echo "0")
          if [ "$FAIL_COUNT" -gt 0 ]; then
            echo "::error::Verification found $FAIL_COUNT failing checks — blocking sandbox gate"
            python3 -c "
          import json
          d = json.load(open('verify-result.json'))
          for c in d.get('checks', []):
              if c['status'] == 'fail':
                  print(f\"  FAIL: {c['name']}: {c['detail']}\")
          " 2>/dev/null || true
            exit 1
          fi
          echo "All verification checks passed"

      - name: Post-publish smoke test
        id: smoke
        env:
          ACUMATICA_URL: ${{ secrets.ACUMATICA_SANDBOX_URL }}
          ACUMATICA_USERNAME: ${{ secrets.ACUMATICA_SANDBOX_USERNAME }}
          ACUMATICA_PASSWORD: ${{ secrets.ACUMATICA_SANDBOX_PASSWORD }}
          ACUMATICA_TENANT: ${{ secrets.ACUMATICA_SANDBOX_TENANT }}
        run: |
          python -c "
          import sys, os
          sys.path.insert(0, 'pipeline')
          from scripts.deploy import AcumaticaCustomizationClient
          client = AcumaticaCustomizationClient(
              os.environ['ACUMATICA_URL'],
              os.environ['ACUMATICA_USERNAME'],
              os.environ['ACUMATICA_PASSWORD'],
              os.environ['ACUMATICA_TENANT'],
          )
          client.login()
          ok = client.smoke_test()
          client.logout()
          if not ok:
              print('::error::Sandbox smoke test FAILED — login broken after publish. BLOCKING production deploy.')
              sys.exit(1)
          print('Sandbox smoke test passed')
          "

      # ── UI Tests — hard gate before production ──────────────────
      - name: Install test dependencies
        run: |
          pip install playwright pytest pytest-timeout
          playwright install chromium

      - name: Generate UI fixtures from audit data
        timeout-minutes: 3
        # P1.1 (2026-04-08): OData 404 from workflow_extractor/fetcher.py blocks every
        # sandbox-gate run. Downgrade to warning until the real fix lands (which OData
        # endpoint is being called, why it 404s). Tracked in docs/prompts/2026-04-08-execute-phase3-convergence.md.
        continue-on-error: true
        env:
          ACUMATICA_URL: ${{ secrets.ACUMATICA_SANDBOX_URL }}
          ACUMATICA_USERNAME: ${{ secrets.ACUMATICA_SANDBOX_USERNAME }}
          ACUMATICA_PASSWORD: ${{ secrets.ACUMATICA_SANDBOX_PASSWORD }}
          ACUMATICA_TENANT: ${{ secrets.ACUMATICA_SANDBOX_TENANT }}
        run: |
          if [ -f scripts/heritage/generate_ui_fixtures.py ]; then
            python scripts/heritage/generate_ui_fixtures.py --days 30 --output tests/fixtures/ui_screens.json || {
              echo "::warning::generate_ui_fixtures.py failed (P1.1 — OData 404). Continuing without fresh fixtures."
            }
          fi

      - name: Run container tracking tests
        timeout-minutes: 35
        env:
          ACUMATICA_URL: ${{ secrets.ACUMATICA_SANDBOX_URL }}
          ACUMATICA_USERNAME: ${{ secrets.ACUMATICA_SANDBOX_USERNAME }}
          ACUMATICA_PASSWORD: ${{ secrets.ACUMATICA_SANDBOX_PASSWORD }}
          ACUMATICA_TENANT: ${{ secrets.ACUMATICA_SANDBOX_TENANT }}
        run: |
          if [ -f tests/ui/test_container_tracking.py ]; then
            python -m pytest tests/ui/test_container_tracking.py -v --tb=long --timeout=120 || {
              echo "::warning::Container tracking tests failed — see logs above"
              exit 1
            }
          else
            echo "No test_container_tracking.py — skipping"
          fi

      - name: Run core UI tests
        timeout-minutes: 8
        env:
          ACUMATICA_URL: ${{ secrets.ACUMATICA_SANDBOX_URL }}
          ACUMATICA_USERNAME: ${{ secrets.ACUMATICA_SANDBOX_USERNAME }}
          ACUMATICA_PASSWORD: ${{ secrets.ACUMATICA_SANDBOX_PASSWORD }}
          ACUMATICA_TENANT: ${{ secrets.ACUMATICA_SANDBOX_TENANT }}
        run: |
          if [ -d tests/ui/ ]; then
            python -m pytest tests/ui/ --ignore=tests/ui/test_container_tracking.py -v --tb=long --timeout=120 || {
              echo "::warning::Core UI tests failed — see logs above"
              exit 1
            }
          else
            echo "No tests/ui/ directory — skipping"
          fi

      - name: Sandbox gate summary
        if: always()
        run: |
          echo "## Sandbox Publish + UI Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Publishes to sandbox (separate instance — no production impact)." >> "$GITHUB_STEP_SUMMARY"
          echo "Runs full UI test suite. **Hard gate — failure blocks prod.**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Step | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Deploy | \`${{ steps.deploy.outcome || 'n/a' }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Verification | \`${{ steps.verify.outcome || 'n/a' }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Smoke Test | \`${{ steps.smoke.outcome || 'n/a' }}\` |" >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────
  # Job: Deploy — Snapshot, countdown, import + publish to Acumatica
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy to ${{ inputs.environment }}
    needs: [sandbox-gate]
    runs-on: ubuntu-latest
    if: >
      always() &&
      inputs.customization_changes == 'true' &&
      (
        needs.sandbox-gate.result == 'success' ||
        needs.sandbox-gate.result == 'skipped' ||
        inputs.force_deploy == 'OVERRIDE'
      )
    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout AcuOps pipeline
        uses: actions/checkout@v4
        with:
          repository: studio-b-ai/acuops-pipeline
          ref: ${{ vars.ACUOPS_PIPELINE_VERSION || 'main' }}
          path: pipeline
          ssh-key: ${{ secrets.ACUOPS_PIPELINE_DEPLOY_KEY }}

      - name: Determine target environment
        id: env
        run: |
          echo "target=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          echo "Determined target environment: ${{ inputs.environment }}"

      - name: Enforce branch protection
        if: steps.env.outputs.target == 'production' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Production deploys must use the main branch. Current ref: ${{ github.ref }}"
          echo "If this is an emergency, merge to main first."
          exit 1

      # ── Deploy-target host assertion ────────────────────────────────
      # Defense-in-depth: refuse to run the deploy job if the resolved
      # URL/tenant for the chosen target is wrong. Mirrors the
      # sandbox-gate guard added after the 2026-04-07 incident.
      #
      # Production: must publish to the prod instance + prod tenant.
      #   Refuses `-sandbox` host drift, refuses tenant="Heritage Test"
      #   masquerading as production, refuses empty secrets.
      # Staging:    Heritage Fabrics has no separate staging instance.
      #   "staging" = Heritage Test tenant on the PROD instance, which
      #   still recycles the prod app pool. Assertion requires the
      #   expected host/tenant pair and refuses the blank STG→PROD
      #   fallback (which would silently publish the real prod tenant).
      #
      # Expected values are hardcoded here intentionally — the host
      # allowlist is a safety control, not configuration. Commercial
      # clients will fork this workflow and set their own values.
      - name: Verify deploy-target URL/tenant
        env:
          TARGET: ${{ steps.env.outputs.target }}
          PROD_URL: ${{ secrets.ACUMATICA_PROD_URL }}
          PROD_TENANT: ${{ secrets.ACUMATICA_PROD_TENANT }}
          STG_URL: ${{ secrets.ACUMATICA_STG_URL }}
          STG_TENANT: ${{ secrets.ACUMATICA_STG_TENANT }}
        run: |
          set -e

          EXPECTED_PROD_HOST="heritagefabrics.acumatica.com"
          EXPECTED_PROD_TENANT="Heritage Fabrics"
          EXPECTED_STG_HOST="heritagefabrics.acumatica.com"
          EXPECTED_STG_TENANT="Heritage Test"

          host_of() {
            echo "$1" | sed -E 's|^https?://||; s|/.*$||; s|:.*$||'
          }

          if [[ "${TARGET}" == "production" ]]; then
            if [[ -z "${PROD_URL}" ]]; then
              echo "::error::ACUMATICA_PROD_URL is empty — refusing to deploy"
              exit 1
            fi
            if [[ -z "${PROD_TENANT}" ]]; then
              echo "::error::ACUMATICA_PROD_TENANT is empty — refusing to deploy"
              exit 1
            fi
            HOST=$(host_of "${PROD_URL}")
            if [[ "${HOST}" != "${EXPECTED_PROD_HOST}" ]]; then
              echo "::error::ACUMATICA_PROD_URL host is '${HOST}', expected '${EXPECTED_PROD_HOST}'"
              echo "::error::Refusing to deploy — wrong prod instance. See 2026-04-07 incident."
              exit 1
            fi
            if [[ "${HOST}" == *"sandbox"* ]]; then
              echo "::error::ACUMATICA_PROD_URL host contains 'sandbox' — that's the sandbox instance, not prod"
              exit 1
            fi
            if [[ "${PROD_TENANT}" == "Heritage Test" ]]; then
              echo "::error::ACUMATICA_PROD_TENANT is 'Heritage Test' — that's the test tenant, not production"
              echo "::error::Publishing to Heritage Test under the 'production' banner still recycles prod but targets the wrong tenant."
              exit 1
            fi
            if [[ "${PROD_TENANT}" != "${EXPECTED_PROD_TENANT}" ]]; then
              echo "::error::ACUMATICA_PROD_TENANT is '${PROD_TENANT}', expected '${EXPECTED_PROD_TENANT}'"
              exit 1
            fi
            echo "[OK] Production target — host: ${HOST}, tenant: ${PROD_TENANT}"

          elif [[ "${TARGET}" == "staging" ]]; then
            # Require STG secrets to be explicitly set. The downstream
            # env blocks fall back to PROD_* when STG_* is empty, which
            # is exactly how today's incident could recur on the
            # staging path. No silent fallback — fail loudly.
            if [[ -z "${STG_URL}" ]]; then
              echo "::error::ACUMATICA_STG_URL is empty and fallback-to-prod is unsafe"
              echo "::error::Set ACUMATICA_STG_URL explicitly, or change target to 'production'."
              exit 1
            fi
            if [[ -z "${STG_TENANT}" ]]; then
              echo "::error::ACUMATICA_STG_TENANT is empty and fallback-to-prod is unsafe"
              echo "::error::Set ACUMATICA_STG_TENANT explicitly, or change target to 'production'."
              exit 1
            fi
            HOST=$(host_of "${STG_URL}")
            if [[ "${HOST}" != "${EXPECTED_STG_HOST}" ]]; then
              echo "::error::ACUMATICA_STG_URL host is '${HOST}', expected '${EXPECTED_STG_HOST}'"
              exit 1
            fi
            if [[ "${STG_TENANT}" != "${EXPECTED_STG_TENANT}" ]]; then
              echo "::error::ACUMATICA_STG_TENANT is '${STG_TENANT}', expected '${EXPECTED_STG_TENANT}'"
              echo "::error::Staging publishes must target Heritage Test on the prod instance."
              exit 1
            fi
            echo "::warning::Staging deploys publish to Heritage Test on the PROD instance."
            echo "::warning::This STILL RECYCLES the prod app pool. Treat as a prod change."
            echo "[OK] Staging target — host: ${HOST}, tenant: ${STG_TENANT}"

          else
            echo "::error::Unknown target '${TARGET}' — expected 'production' or 'staging'"
            exit 1
          fi

      # ── Pre-publish audit — refuse to unpublish anything silently ───
      # publishBegin is instance-wide and unpublishes any currently-
      # published project that is not in projectNames. Before the
      # 2026-03-31 SEV-1, ISV packages were silently unpublished on
      # every deploy because ALSO_PUBLISH_PROJECTS was incomplete.
      # This step calls /CustomizationApi/getPublished on the deploy
      # target and refuses to proceed if the upcoming publish would
      # unpublish anything.
      #
      # Override: set acknowledge_unpublish="OVERRIDE" (workflow_dispatch
      # only) when the unpublish is intentional. force_qualify=true also
      # skips this step (used when prod is down and the audit can't
      # reach the instance anyway).
      - name: Pre-publish audit — verify nothing will be unpublished
        if: >
          inputs.force_qualify != 'true' &&
          inputs.dry_run != 'true'
        env:
          ACUMATICA_URL: ${{ (steps.env.outputs.target == 'production') && secrets.ACUMATICA_PROD_URL || secrets.ACUMATICA_STG_URL }}
          ACUMATICA_USERNAME: ${{ (steps.env.outputs.target == 'production') && secrets.ACUMATICA_PROD_USERNAME || secrets.ACUMATICA_STG_USERNAME }}
          ACUMATICA_PASSWORD: ${{ (steps.env.outputs.target == 'production') && secrets.ACUMATICA_PROD_PASSWORD || secrets.ACUMATICA_STG_PASSWORD }}
          ACUMATICA_TENANT: ${{ (steps.env.outputs.target == 'production') && secrets.ACUMATICA_PROD_TENANT || secrets.ACUMATICA_STG_TENANT }}
          PROJECT_NAME: ${{ inputs.project_name }}
          ALSO_PUBLISH: ${{ inputs.also_publish }}
          ACKNOWLEDGE_UNPUBLISH: ${{ inputs.acknowledge_unpublish }}
        run: |
          python3 <<'PY'
          import json, os, sys, ssl
          import http.cookiejar
          import urllib.request, urllib.error

          base = os.environ["ACUMATICA_URL"].rstrip("/")
          primary = os.environ["PROJECT_NAME"]
          also = [p.strip() for p in os.environ.get("ALSO_PUBLISH", "").split(",") if p.strip()]
          expected = set([primary] + also)

          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          # Full cookie jar — Acumatica sets 7 cookies on login
          # (.ASPXAUTH, ASP.NET_SessionId, CompanyID, Locale, UserBranch,
          # requestid, requeststat). Using getheader("Set-Cookie") only
          # captures the first one, and CustomizationApi returns 401
          # without ASP.NET_SessionId.
          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(
              urllib.request.HTTPSHandler(context=ctx),
              urllib.request.HTTPCookieProcessor(jar),
          )

          def req(method, path, body=None):
              hdrs = {"Content-Type": "application/json"}
              url = base + "/" + path.lstrip("/")
              r = urllib.request.Request(url, data=body, headers=hdrs, method=method)
              try:
                  with opener.open(r, timeout=30) as resp:
                      return resp.status, resp.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()

          # Login
          login_body = json.dumps({
              "name":     os.environ["ACUMATICA_USERNAME"],
              "password": os.environ["ACUMATICA_PASSWORD"],
              "tenant":   os.environ["ACUMATICA_TENANT"],
          }).encode()
          status, body = req("POST", "/entity/auth/login", body=login_body)
          if status not in (200, 204):
              print("::error::Pre-publish audit: login failed (HTTP " + str(status) + "): " + body.decode(errors="replace")[:300])
              sys.exit(1)

          try:
              # List currently-published customization projects
              status, body = req("POST", "/CustomizationApi/getPublished")
              if status != 200:
                  print("::error::Pre-publish audit: getPublished failed (HTTP " + str(status) + "): " + body.decode(errors="replace")[:300])
                  sys.exit(1)
              data = json.loads(body)
              currently = sorted({p.get("name", "") for p in data.get("projects", []) if p.get("name")})

              print("Currently published (" + str(len(currently)) + "):")
              for n in currently:
                  print("  - " + n)
              print("Expected after publish (" + str(len(expected)) + "):")
              for n in sorted(expected):
                  print("  - " + n)

              would_unpublish = sorted(set(currently) - expected)

              if not would_unpublish:
                  print("[OK] Pre-publish audit passed — " + str(len(currently)) + " projects currently published, none will be unpublished.")
                  sys.exit(0)

              # With merge=true (the default), projects not in projectNames are
              # PRESERVED — they stay published. The 2026-03-31 SEV-1 was caused
              # by emergency-deploy.py using merge=false, not the normal path.
              #
              # The 2026-04-15 PCC outage proved that including all 11 projects
              # (ISV + custom) in a single publishBegin causes PXPageIndexingService
              # to exceed the server-side ~75s thread timeout (ThreadAbortException).
              # Fix: only include Aesthetik-owned projects in projectNames. ISV
              # packages stay published via merge=true.
              #
              # Warn (not block) about ISV packages not in the compile set.
              print("::warning::Pre-publish audit: these currently-published projects are NOT in projectNames:")
              for n in would_unpublish:
                  print("::warning::  - " + n)
              print("::warning::With merge=true (default), these packages are PRESERVED — they stay published.")
              print("::warning::They are excluded from projectNames to avoid PXPageIndexingService ThreadAbortException (2026-04-15 PCC outage).")
              print("[OK] Pre-publish audit passed — ISV packages preserved by merge=true.")
              sys.exit(0)
          finally:
              try:
                  req("POST", "/entity/auth/logout")
              except Exception:
                  pass
          PY

      - name: Load pipeline config from acuops.yaml
        id: pipeline_cfg
        run: |
          # Read pipeline-specific config (lockout_url, regression_url)
          # These are infrastructure endpoints, not credentials — safe for outputs
          if command -v yq &>/dev/null || pip install yq 2>/dev/null; then
            YQ="yq"
          else
            YQ=""
          fi
          LOCKOUT=""
          REGRESSION=""
          if [[ -n "${YQ}" && -f acuops.yaml ]]; then
            LOCKOUT=$(${YQ} -r '.pipeline.lockout_url // ""' acuops.yaml 2>/dev/null || echo "")
            REGRESSION=$(${YQ} -r '.pipeline.regression_url // ""' acuops.yaml 2>/dev/null || echo "")
          fi
          echo "lockout_url=${LOCKOUT}" >> "$GITHUB_OUTPUT"
          echo "regression_url=${REGRESSION}" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          if [ -f pipeline/requirements.txt ]; then
            pip install -r pipeline/requirements.txt
          fi

      # ── Pre-deploy snapshot ──────────────────────────────────────────
      - name: Pre-deploy snapshot
        id: snapshot
        if: >
          inputs.dry_run != 'true'
        env:
          ACUMATICA_URL: ${{ (steps.env.outputs.target == 'production') && secrets.ACUMATICA_PROD_URL || (secrets.ACUMATICA_STG_URL || secrets.ACUMATICA_PROD_URL) }}
          ACUMATICA_USERNAME: ${{ (steps.env.outputs.target == 'production') && secrets.ACUMATICA_PROD_USERNAME || (secrets.ACUMATICA_STG_USERNAME || secrets.ACUMATICA_PROD_USERNAME) }}
          ACUMATICA_PASSWORD: ${{ (steps.env.outputs.target == 'production') && secrets.ACUMATICA_PROD_PASSWORD || (secrets.ACUMATICA_STG_PASSWORD || secrets.ACUMATICA_PROD_PASSWORD) }}
          ACUMATICA_TENANT: ${{ (steps.env.outputs.target == 'production') && secrets.ACUMATICA_PROD_TENANT || (secrets.ACUMATICA_STG_TENANT || secrets.ACUMATICA_PROD_TENANT) }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python3 pipeline/scripts/deploy.py --download \
            --project "${{ inputs.project_name }}" \
            --output backups/

      - name: Upload pre-deploy snapshot
        if: steps.snapshot.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pre-deploy-snapshot-${{ github.run_number }}
          path: backups/*.zip
          retention-days: 365

      # ── Business hours detection + HARD GATE ─────────────────────────
      # Publishing to the production Acumatica instance restarts the app
      # pool and kicks all live users. During business hours (6am–6pm ET
      # Mon–Fri) the deploy job is BLOCKED unless force_business_hours is
      # set. Sandbox-gate already ran against the separate sandbox
      # instance — this only gates the real prod publish.
      - name: Check if after-hours
        id: hours
        run: |
          TIMEZONE="America/New_York"
          HOUR=$(TZ="${TIMEZONE}" date +%H)
          DOW=$(TZ="${TIMEZONE}" date +%u)
          # After-hours = weekends (Sat=6, Sun=7) OR before 6am OR after 6pm (18:00)
          if [ "$DOW" -ge 6 ] || [ "$HOUR" -ge 18 ] || [ "$HOUR" -lt 6 ]; then
            echo "after_hours=true" >> "$GITHUB_OUTPUT"
            echo "After-hours deploy (day=${DOW} ${HOUR}:00 ${TIMEZONE}) — employee emails suppressed"
          else
            echo "after_hours=false" >> "$GITHUB_OUTPUT"
            echo "Business-hours deploy (day=${DOW} ${HOUR}:00 ${TIMEZONE}) — employee emails will be sent"
          fi

      - name: Enforce after-hours gate for prod/staging publishes
        if: >
          steps.env.outputs.target != 'sandbox' &&
          inputs.dry_run != 'true' &&
          inputs.force_business_hours != 'true' &&
          steps.hours.outputs.after_hours != 'true'
        run: |
          TIMEZONE="America/New_York"
          HOUR=$(TZ="${TIMEZONE}" date +%H)
          DOW=$(TZ="${TIMEZONE}" date +%u)
          echo "::error::BLOCKED: business-hours deploy to ${{ steps.env.outputs.target }}."
          echo "::error::Current local time: day=${DOW} ${HOUR}:00 ${TIMEZONE}"
          echo "::error::Publishing to the production instance restarts the app pool and disconnects live users."
          echo "::error::Deploys to prod/staging are held until 6:00 PM ET Mon-Fri, or any time on weekends."
          echo "::error::To override for a genuine emergency, re-run with force_business_hours=true."
          echo "## 🚫 Deploy blocked by after-hours gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Target | ${{ steps.env.outputs.target }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Local time | day=${DOW} ${HOUR}:00 ${TIMEZONE} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Window | Weekdays 6:00 PM ET – 6:00 AM ET, or anytime on weekends |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Override | Re-run with force_business_hours=true |" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # ── Countdown notification ───────────────────────────────────────
      - name: Send maintenance countdown warnings
        if: >
          steps.env.outputs.target == 'production' &&
          inputs.force_qualify != 'true' &&
          inputs.dry_run != 'true'
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          NOTIFY_RECIPIENTS: ${{ vars.NOTIFY_RECIPIENTS }}
          NOTIFY_SENDER: ${{ vars.NOTIFY_SENDER }}
        run: |
          # notify.py requires --recipients; skip entirely if not configured.
          # The build job used to expose notify_recipients/notify_sender as
          # outputs but they were never actually wired up (broken since before
          # the pipeline split). GitHub Variables are the new source of truth.
          if [ -f pipeline/scripts/notify.py ] && [ -n "${NOTIFY_RECIPIENTS}" ]; then
            python pipeline/scripts/notify.py \
              --type countdown \
              --minutes 20 \
              --recipients "${NOTIFY_RECIPIENTS}" \
              --sender "${NOTIFY_SENDER}" \
              --project "${{ inputs.project_name }}" \
              --environment "${{ steps.env.outputs.target }}" \
              --slack-webhook "${SLACK_WEBHOOK_URL}" \
              ${{ steps.hours.outputs.after_hours == 'true' && '--skip-email' || '' }}
          else
            echo "Skipping notify — NOTIFY_RECIPIENTS var not set"
          fi

      # ── Pre-deploy smoke test ────────────────────────────────────────
      - name: Pre-deploy smoke test
        if: inputs.force_qualify != 'true' && inputs.dry_run != 'true'
        env:
          ACUMATICA_URL: ${{ (steps.env.outputs.target == 'production') && secrets.ACUMATICA_PROD_URL || (secrets.ACUMATICA_STG_URL || secrets.ACUMATICA_PROD_URL) }}
          ACUMATICA_USERNAME: ${{ (steps.env.outputs.target == 'production') && secrets.ACUMATICA_PROD_USERNAME || (secrets.ACUMATICA_STG_USERNAME || secrets.ACUMATICA_PROD_USERNAME) }}
          ACUMATICA_PASSWORD: ${{ (steps.env.outputs.target == 'production') && secrets.ACUMATICA_PROD_PASSWORD || (secrets.ACUMATICA_STG_PASSWORD || secrets.ACUMATICA_PROD_PASSWORD) }}
          ACUMATICA_TENANT: ${{ (steps.env.outputs.target == 'production') && secrets.ACUMATICA_PROD_TENANT || (secrets.ACUMATICA_STG_TENANT || secrets.ACUMATICA_PROD_TENANT) }}
        run: |
          # Verifies instance is alive before importing. Emergency deploys
          # (force_qualify=true) skip this — the instance may be down due to
          # a bad customization that this deploy is fixing.
          python -c "
          import sys, os; sys.path.insert(0, 'pipeline')
          from scripts.deploy import AcumaticaCustomizationClient
          client = AcumaticaCustomizationClient(
              os.environ['ACUMATICA_URL'], os.environ['ACUMATICA_USERNAME'],
              os.environ['ACUMATICA_PASSWORD'], os.environ['ACUMATICA_TENANT'],
          )
          client.login()
          ok = client.smoke_test()
          client.logout()
          sys.exit(0 if ok else 1)
          "

      # ── Download built packages ──────────────────────────────────────
      - name: Download package artifacts
        if: inputs.dry_run != 'true'
        uses: actions/download-artifact@v4
        with:
          name: customization-package
          path: dist/

      # ── DEPLOY — Import + Publish to Acumatica ──────────────────────
      - name: Import and publish customization
        id: deploy
        if: inputs.dry_run != 'true'
        env:
          ACUMATICA_URL: ${{ (steps.env.outputs.target == 'production') && secrets.ACUMATICA_PROD_URL || (secrets.ACUMATICA_STG_URL || secrets.ACUMATICA_PROD_URL) }}
          ACUMATICA_USERNAME: ${{ (steps.env.outputs.target == 'production') && secrets.ACUMATICA_PROD_USERNAME || (secrets.ACUMATICA_STG_USERNAME || secrets.ACUMATICA_PROD_USERNAME) }}
          ACUMATICA_PASSWORD: ${{ (steps.env.outputs.target == 'production') && secrets.ACUMATICA_PROD_PASSWORD || (secrets.ACUMATICA_STG_PASSWORD || secrets.ACUMATICA_PROD_PASSWORD) }}
          ACUMATICA_TENANT: ${{ (steps.env.outputs.target == 'production') && secrets.ACUMATICA_PROD_TENANT || (secrets.ACUMATICA_STG_TENANT || secrets.ACUMATICA_PROD_TENANT) }}
        run: |
          PROJECT="${{ inputs.project_name }}"
          ALSO="${{ inputs.also_publish }}"
          PACKAGE_FILE=$(ls dist/${PROJECT}_*.zip 2>/dev/null | head -1)
          if [ -z "${PACKAGE_FILE}" ]; then
            echo "::error::No package found in dist/ for ${PROJECT}"
            exit 1
          fi

          # Build extra import flags for co-managed packages
          EXTRA_FLAGS=""
          for pkg in dist/*.zip; do
            if [ "${pkg}" != "${PACKAGE_FILE}" ]; then
              PKG_BASE=$(basename "${pkg}" .zip)
              PKG_NAME=$(echo "${PKG_BASE}" | sed 's/_[0-9]\{8\}-[0-9]\{6\}$//')
              EXTRA_FLAGS+=" --extra-import ${PKG_NAME}:${pkg}"
            fi
          done

          DEPLOY_START=$(date +%s)

          echo "Deploying ${PACKAGE_FILE} to ${{ steps.env.outputs.target }}"

          # Emergency path: use basic auth when session login is broken
          if [ "${{ inputs.force_qualify }}" = "true" ]; then
            echo "::warning::force_qualify=true — using emergency deploy path (bypasses broken session login)"
            mkdir -p /tmp/emergency-pkg
            unzip -o "${PACKAGE_FILE}" -d /tmp/emergency-pkg/

            # Also unzip and import extra packages
            for pkg in dist/*.zip; do
              if [ "${pkg}" != "${PACKAGE_FILE}" ]; then
                PKG_BASE=$(basename "${pkg}" .zip)
                PKG_NAME=$(echo "${PKG_BASE}" | sed 's/_[0-9]\{8\}-[0-9]\{6\}$//')
                mkdir -p "/tmp/extra-${PKG_NAME}"
                unzip -o "${pkg}" -d "/tmp/extra-${PKG_NAME}/"
                # Import only — do NOT publish individually. A single publishBegin
                # at the end includes ALL projects. Publishing extras one-by-one
                # would set the instance published list to just that one project.
                PACKAGE_DIR="/tmp/extra-${PKG_NAME}" PROJECT_NAME="${PKG_NAME}" \
                  IMPORT_ONLY=true \
                  python pipeline/scripts/emergency-deploy.py
              fi
            done

            PACKAGE_DIR=/tmp/emergency-pkg PROJECT_NAME="${PROJECT}" \
              ALSO_PUBLISH_PROJECTS="${ALSO}" \
              python pipeline/scripts/emergency-deploy.py
          else
            # --no-merge REMOVED 2026-04-15: orphan CustProject rows no longer
            # block merge=true (validated via empty-list publishBegin on prod).
            # merge=true restores GI OData re-registration that no-merge skipped.
            # --pre-cleanup REMOVED: it attempts to delete live projects which
            # trips NullReferenceException in UserRecordsDBUpdater.
            python3 pipeline/scripts/deploy.py \
              --project "${PROJECT}" \
              --package "${PACKAGE_FILE}" \
              --also-publish "${ALSO}" \
              ${EXTRA_FLAGS}
          fi

          DEPLOY_END=$(date +%s)
          echo "duration_ms=$(( (DEPLOY_END - DEPLOY_START) * 1000 ))" >> "$GITHUB_OUTPUT"
          echo "outcome=success" >> "$GITHUB_OUTPUT"

      # ── Post-publish verification ──────────────────────────────────
      - name: Post-publish verification
        id: verify
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        env:
          ACUMATICA_URL: ${{ (steps.env.outputs.target == 'production') && secrets.ACUMATICA_PROD_URL || (secrets.ACUMATICA_STG_URL || secrets.ACUMATICA_PROD_URL) }}
          ACUMATICA_USERNAME: ${{ secrets.ACUMATICA_VERIFY_USERNAME || ((steps.env.outputs.target == 'production') && secrets.ACUMATICA_PROD_USERNAME || (secrets.ACUMATICA_STG_USERNAME || secrets.ACUMATICA_PROD_USERNAME)) }}
          ACUMATICA_PASSWORD: ${{ secrets.ACUMATICA_VERIFY_PASSWORD || ((steps.env.outputs.target == 'production') && secrets.ACUMATICA_PROD_PASSWORD || (secrets.ACUMATICA_STG_PASSWORD || secrets.ACUMATICA_PROD_PASSWORD)) }}
          ACUMATICA_TENANT: ${{ (steps.env.outputs.target == 'production') && secrets.ACUMATICA_PROD_TENANT || (secrets.ACUMATICA_STG_TENANT || secrets.ACUMATICA_PROD_TENANT) }}
        run: |
          python scripts/verify.py \
            --manifest publish-manifest.json \
            --environment ${{ steps.env.outputs.target }} \
            --project "${{ inputs.project_name }}" \
            --no-merge-expected acuops.yaml \
            --json-output verify-result.json

      - name: Upload verification result
        if: always() && steps.verify.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: verify-result-${{ steps.env.outputs.target }}
          path: verify-result.json
          if-no-files-found: ignore

      # ── Alert on verification failure (NO auto-rollback) ─────────────
      - name: Alert on verification failure
        id: alert
        if: >
          steps.deploy.outcome == 'success' &&
          steps.verify.outcome == 'failure' &&
          steps.env.outputs.target == 'production' &&
          inputs.dry_run != 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_KEVIN_USER_ID: ${{ secrets.SLACK_KEVIN_USER_ID }}
        run: |
          PROJECT="${{ inputs.project_name }}"
          VERIFY="${{ steps.verify.outcome }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          echo "::error::Post-publish verification failed (verify=${VERIFY})"
          echo "Backup snapshot available as workflow artifact for manual restore via SM204505"

          if [ -n "${SLACK_BOT_TOKEN}" ] && [ -n "${SLACK_KEVIN_USER_ID}" ]; then
            # Open DM channel with Kevin
            DM_CHANNEL=$(curl -sf -X POST "https://slack.com/api/conversations.open" \
              -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"users\":\"${SLACK_KEVIN_USER_ID}\"}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('channel',{}).get('id',''))" 2>/dev/null)

            if [ -n "${DM_CHANNEL}" ]; then
              curl -sf -X POST "https://slack.com/api/chat.postMessage" \
                -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "{\"channel\":\"${DM_CHANNEL}\",\"text\":\"⚠️ *Deploy verification failed* — ${PROJECT}\nVerify: ${VERIFY}\nCommit: \`${GITHUB_SHA::8}\`\n<${RUN_URL}|View Logs>\nNo rollback attempted. Backup artifact available for manual restore via SM204505.\"}" > /dev/null
            fi
          fi
          exit 1

      # ── Auto-ingest to Qdrant knowledge base ──────────────────────────
      - name: Auto-ingest deploy incident
        if: >
          always() &&
          steps.deploy.outcome == 'success' &&
          steps.verify.outcome == 'failure'
        continue-on-error: true
        env:
          ACUDEV_URL: ${{ secrets.ACUDEV_URL }}
          ACUDEV_API_KEY: ${{ secrets.ACUDEV_API_KEY }}
        run: |
          ERROR_DETAIL="Verification failed"
          ERROR_SIGNATURE="verify:unknown"
          if [ -f verify-result.json ]; then
            ERROR_DETAIL=$(python3 -c "
          import sys, json
          d = json.load(open('verify-result.json'))
          fails = [c for c in d.get('checks', []) if c['status'] == 'fail']
          print('; '.join(f\"{c['name']}: {c['detail']}\" for c in fails[:5]))
          " 2>/dev/null || echo "Verification failed — see logs")
            # Derive canonical error signature (see docs/architecture/error-signatures.md)
            ERROR_SIGNATURE=$(python3 -c "
          import json
          d = json.load(open('verify-result.json'))
          fails = [c for c in d.get('checks', []) if c['status'] == 'fail']
          if not fails: print('verify:unknown')
          else:
              c = fails[0]
              name = c['name'].lower().replace(' ', '-')
              detail = c.get('detail', '')
              suffix = ''
              if '401' in detail: suffix = '-401'
              elif '404' in detail: suffix = '-404'
              elif '500' in detail: suffix = '-500'
              elif 'timeout' in detail.lower(): suffix = '-timeout'
              elif 'mismatch' in detail.lower(): suffix = '-mismatch'
              print(f'verify:{name}{suffix}')
          " 2>/dev/null || echo "verify:unknown")
          fi
          curl -sf -X POST "${ACUDEV_URL}/ingest/incident" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${ACUDEV_API_KEY}" \
            -d "{
              \"event\": \"verification_failed\",
              \"project\": \"${{ inputs.project_name }}\",
              \"environment\": \"${{ steps.env.outputs.target }}\",
              \"commit\": \"${GITHUB_SHA::8}\",
              \"error_detail\": $(echo "$ERROR_DETAIL" | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read().strip()))'),
              \"error_signature\": \"${ERROR_SIGNATURE}\",
              \"run_url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",
              \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
            }" || echo "[WARN] Auto-ingestion failed — non-blocking"

      - name: Auto-ingest deploy success
        if: >
          steps.deploy.outcome == 'success' &&
          steps.verify.outcome == 'success' &&
          steps.env.outputs.target == 'production'
        continue-on-error: true
        env:
          ACUDEV_URL: ${{ secrets.ACUDEV_URL }}
          ACUDEV_API_KEY: ${{ secrets.ACUDEV_API_KEY }}
        run: |
          curl -sf -X POST "${ACUDEV_URL}/ingest/incident" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${ACUDEV_API_KEY}" \
            -d "{
              \"event\": \"deploy_succeeded\",
              \"project\": \"${{ inputs.project_name }}\",
              \"environment\": \"production\",
              \"commit\": \"${GITHUB_SHA::8}\",
              \"error_detail\": \"All checks passed\",
              \"run_url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",
              \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
            }" || echo "[WARN] Auto-ingestion failed — non-blocking"

      # ── Trigger regression tests ─────────────────────────────────────
      - name: Trigger regression tests
        if: always() && steps.env.outputs.target == 'production' && inputs.dry_run != 'true'
        continue-on-error: true
        env:
          REGRESSION_WEBHOOK_URL: ${{ steps.pipeline_cfg.outputs.regression_url }}
          REGRESSION_AUTH: ${{ secrets.REGRESSION_WEBHOOK_SECRET }}
        run: |
          if [ -z "${REGRESSION_WEBHOOK_URL}" ] || [ -z "${REGRESSION_AUTH}" ]; then
            echo "Regression URL or auth not configured — skipping"
            exit 0
          fi
          TARGET="${{ steps.env.outputs.target }}"
          COMMIT="${{ github.sha }}"
          RESPONSE=$(curl -sf -X POST "${REGRESSION_WEBHOOK_URL}/api/regression/trigger" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Auth: ${REGRESSION_AUTH}" \
            -d "{\"environment\": \"${TARGET}\", \"deployCommit\": \"${COMMIT}\", \"trigger\": \"post-deploy\"}" \
            --max-time 10 || true)
          echo "Regression trigger response: ${RESPONSE}"

      # ── Deploy Intelligence — Record + Report ────────────────────────
      - name: Deploy Intelligence — Record outcome
        if: always()
        run: |
          OUTCOME="${{ steps.deploy.outcome == 'success' && 'success' || 'publish_failure' }}"
          DURATION="${{ steps.deploy.outputs.duration_ms || '0' }}"

          python pipeline/scripts/intelligence.py record \
            --project-xml Customization/_project/project.xml \
            --history data/deploy-history.json \
            --outcome "${OUTCOME}" \
            --duration-ms "${DURATION}" \
            --commit-sha "${GITHUB_SHA}" \
            --environment "${{ steps.env.outputs.target }}" || true

      - name: Deploy Intelligence — Generate report
        if: always()
        run: |
          python pipeline/scripts/intelligence.py report \
            --project-xml Customization/_project/project.xml \
            --history data/deploy-history.json \
            --output intelligence-report.md || true

          if [[ -f intelligence-report.md ]]; then
            cat intelligence-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload intelligence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intelligence-report
          path: |
            intelligence-report.md
            data/deploy-history.json
          retention-days: 90

      - name: Commit deploy history
        if: success() && github.event_name == 'push'
        run: |
          git config user.name "AcuOps Intelligence"
          git config user.email "acuops@users.noreply.github.com"
          git add data/deploy-history.json
          git diff --cached --quiet || \
            git commit -m "[skip ci] Update deploy history — ${{ steps.env.outputs.target }}" && \
            git push || true

      # ── Post-deploy notifications ─────────────────────────────────────
      - name: Notify system back online
        if: success() && steps.env.outputs.target == 'production'
        continue-on-error: true
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          NOTIFY_RECIPIENTS: ${{ vars.NOTIFY_RECIPIENTS }}
          NOTIFY_SENDER: ${{ vars.NOTIFY_SENDER }}
        run: |
          if [ -f pipeline/scripts/notify.py ] && [ -n "${NOTIFY_RECIPIENTS}" ]; then
            python pipeline/scripts/notify.py \
              --type online \
              --recipients "${NOTIFY_RECIPIENTS}" \
              --sender "${NOTIFY_SENDER}" \
              --project "${{ inputs.project_name }}" \
              --environment "${{ steps.env.outputs.target }}" \
              --slack-webhook "${SLACK_WEBHOOK_URL}" \
              ${{ steps.hours.outputs.after_hours == 'true' && '--skip-email' || '' }}
          else
            echo "Skipping notify — NOTIFY_RECIPIENTS var not set"
          fi

      - name: Notify deploy failed
        if: failure() && steps.env.outputs.target == 'production'
        continue-on-error: true
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          NOTIFY_RECIPIENTS: ${{ vars.NOTIFY_RECIPIENTS }}
          NOTIFY_SENDER: ${{ vars.NOTIFY_SENDER }}
        run: |
          if [ -f pipeline/scripts/notify.py ] && [ -n "${NOTIFY_RECIPIENTS}" ]; then
            python pipeline/scripts/notify.py \
              --type failed \
              --recipients "${NOTIFY_RECIPIENTS}" \
              --sender "${NOTIFY_SENDER}" \
              --project "${{ inputs.project_name }}" \
              --environment "${{ steps.env.outputs.target }}" \
              --slack-webhook "${SLACK_WEBHOOK_URL}" \
              ${{ steps.hours.outputs.after_hours == 'true' && '--skip-email' || '' }}
          else
            echo "Skipping notify — NOTIFY_RECIPIENTS var not set"
          fi

      # ── Auto-lockout on deploy failure ───────────────────────────────
      # Prevents other services from hammering a broken Acumatica instance
      # while the deploy failure is being investigated.
      - name: Auto-lockout on deploy failure
        if: failure() && steps.deploy.outcome == 'failure' && steps.env.outputs.target == 'production'
        continue-on-error: true
        run: |
          LOCKOUT_URL="${{ steps.pipeline_cfg.outputs.lockout_url }}"
          if [ -n "${LOCKOUT_URL}" ]; then
            curl -sf -X POST "${LOCKOUT_URL}/maintenance/start" \
              -H "Content-Type: application/json" \
              -d '{"ttl": 3600, "reason": "Auto-lockout: CI/CD deploy failed — preventing retry storm"}' \
              --max-time 5 || echo "Lockout endpoint unreachable — manual lockout may be needed"
            echo "::warning::Auto-lockout enabled for 1 hour. Clear with POST ${LOCKOUT_URL}/maintenance/end when resolved."
          else
            echo "No lockout_url configured — skipping auto-lockout"
          fi

      # ── Slack failure notification ───────────────────────────────────
      - name: DM Kevin on deploy failure
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_KEVIN_USER_ID: ${{ secrets.SLACK_KEVIN_USER_ID }}
        run: |
          PROJECT="${{ inputs.project_name }}"
          TARGET="${{ steps.env.outputs.target }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ -n "${SLACK_BOT_TOKEN}" ] && [ -n "${SLACK_KEVIN_USER_ID}" ]; then
            DM_CHANNEL=$(curl -sf -X POST "https://slack.com/api/conversations.open" \
              -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"users\":\"${SLACK_KEVIN_USER_ID}\"}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('channel',{}).get('id',''))" 2>/dev/null)

            if [ -n "${DM_CHANNEL}" ]; then
              curl -sf -X POST "https://slack.com/api/chat.postMessage" \
                -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "{\"channel\":\"${DM_CHANNEL}\",\"text\":\"🚨 *Deploy FAILED* — ${PROJECT} → \`${TARGET}\`\nCommit: \`${GITHUB_SHA::8}\`\n<${RUN_URL}|View Logs>\"}" > /dev/null
            fi
          fi

      - name: Post deployment summary
        if: always()
        run: |
          PROJECT="${{ inputs.project_name }}"
          TARGET="${{ steps.env.outputs.target }}"
          echo "## Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | \`${TARGET}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Project | \`${PROJECT}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Package | \`${{ inputs.package_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${GITHUB_SHA::8}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Actor | @${GITHUB_ACTOR} |" >> "$GITHUB_STEP_SUMMARY"
          SNAPSHOT_FILES=$(ls backups/*.zip 2>/dev/null | xargs -I{} basename {} | tr '\n' ', ' || echo "N/A")
          echo "| Snapshot | ${SNAPSHOT_FILES:-N/A} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Verify | \`${{ steps.verify.outcome || 'n/a' }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Alert | \`${{ steps.alert.outcome || 'n/a' }}\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Tag successful deploy
        if: success() && steps.env.outputs.target == 'production'
        run: |
          TAG="deploy/prod/$(date +%Y%m%d-%H%M%S)"
          git tag "${TAG}"
          git push origin "${TAG}"
          echo "Tagged: ${TAG}"

      # Success notifications removed — Kevin only wants DMs on failures/decisions

  # ──────────────────────────────────────────────
  # Job: AI Failure Recovery — diagnose and fix sandbox failures
  # ──────────────────────────────────────────────
  # DISABLED 2026-04-07: dispatch loop. The recovery agent re-dispatched
  # AcuOps Deploy after each sandbox-gate failure, and because
  # ACUMATICA_SANDBOX_URL/TENANT secrets pointed at prod / Heritage Test,
  # every retry recycled the prod app pool. 8 prod restarts in 14 hours.
  # Re-enable only after:
  #   1. ✅ ACUMATICA_SANDBOX_URL + ACUMATICA_SANDBOX_TENANT corrected (2026-04-07)
  #   2. ✅ GH_PAT_DISPATCH retired — acuops-agent App token live (Task 2.3, 2026-04-09)
  #   3. ✅ Recovery agent capped at 5 dispatches per 24h via LARRY_DISPATCH_COUNT
  #      GH variable + LARRY_KILL_SWITCH external off switch (2026-04-09)
  invoke-agent:
    name: AI Failure Recovery
    needs: [sandbox-gate]
    continue-on-error: true
    if: >-
      always() &&
      inputs.customization_changes == 'true' &&
      needs.sandbox-gate.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download sandbox test logs
        run: |
          # Get the sandbox-gate job ID and download its logs
          JOB_ID=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs \
            --jq '.jobs[] | select(.name == "Sandbox Publish + UI Tests") | .id')
          if [ -n "$JOB_ID" ]; then
            gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs/$JOB_ID/logs \
              > sandbox-gate-logs.txt 2>/dev/null || true
          fi
          # Also grab any test artifacts
          gh run download ${{ github.run_id }} --name verify-result-sandbox --dir ./verify-results 2>/dev/null || true
        env:
          # Same-repo gh api + gh run download — built-in GITHUB_TOKEN is
          # sufficient and shows up as github-actions[bot] in audit logs
          # (Safety Package gate #2: agent attribution must not be Kevin).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Larry Loop safety gates (contract: larry-loop.md) ────────────
      # GITHUB_TOKEN lacks variables:read/write scope. Mint an acuops-agent
      # App token which has org-level access including repo variables.
      - name: Mint acuops-agent token for Larry gates
        id: larry-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.ACUOPS_AGENT_APP_ID }}
          private-key: ${{ secrets.ACUOPS_AGENT_PRIVATE_KEY }}

      - name: Check Larry kill switch
        id: larry-kill
        env:
          GH_TOKEN: ${{ steps.larry-token.outputs.token }}
        run: |
          KILL=$(gh variable get LARRY_KILL_SWITCH --repo ${{ github.repository }} 2>/dev/null || echo "false")
          if [ "$KILL" = "true" ]; then
            echo "::warning::Larry kill switch is ON — skipping AI recovery"
            echo "killed=true" >> $GITHUB_OUTPUT
          else
            echo "killed=false" >> $GITHUB_OUTPUT
          fi

      - name: Check Larry dispatch counter
        id: larry-counter
        if: steps.larry-kill.outputs.killed != 'true'
        env:
          GH_TOKEN: ${{ steps.larry-token.outputs.token }}
        run: |
          COUNTER_JSON=$(gh variable get LARRY_DISPATCH_COUNT --repo ${{ github.repository }} 2>/dev/null || echo '{"count":0,"window_start":"1970-01-01T00:00:00Z"}')
          COUNT=$(echo "$COUNTER_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['count'])")
          WINDOW=$(echo "$COUNTER_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['window_start'])")

          # Reset window if expired (>24h)
          EXPIRED=$(python3 -c "
          from datetime import datetime, timezone, timedelta
          window = datetime.fromisoformat('$WINDOW'.replace('Z','+00:00'))
          now = datetime.now(timezone.utc)
          print('true' if (now - window) > timedelta(hours=24) else 'false')
          ")

          if [ "$EXPIRED" = "true" ]; then
            COUNT=0
            WINDOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          fi

          CAP=5
          if [ "$COUNT" -ge "$CAP" ]; then
            echo "::error::Larry dispatch counter at $COUNT/$CAP (window started $WINDOW). Budget exhausted — escalating."
            echo "blocked=true" >> $GITHUB_OUTPUT
          else
            echo "Larry dispatch counter: $COUNT/$CAP (window started $WINDOW)"
            echo "blocked=false" >> $GITHUB_OUTPUT
            echo "new_count=$((COUNT + 1))" >> $GITHUB_OUTPUT
            echo "window_start=$WINDOW" >> $GITHUB_OUTPUT
          fi

      - name: Increment Larry dispatch counter
        if: steps.larry-kill.outputs.killed != 'true' && steps.larry-counter.outputs.blocked != 'true'
        env:
          GH_TOKEN: ${{ steps.larry-token.outputs.token }}
        run: |
          gh variable set LARRY_DISPATCH_COUNT \
            --repo ${{ github.repository }} \
            --body "{\"count\":${{ steps.larry-counter.outputs.new_count }},\"window_start\":\"${{ steps.larry-counter.outputs.window_start }}\"}"

      - name: Escalate on budget exhaustion
        if: steps.larry-counter.outputs.blocked == 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          # DM Kevin (fallback originator) with Larry escalation payload
          curl -sf -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"channel\": \"U0ALNRQ4KF0\",
              \"text\": \"⚠️ *Larry dispatch budget exhausted* — AI Failure Recovery hit 5/5 dispatches in 24h.\nProject: ${{ inputs.project_name }}\nRun: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Logs>\n\nManual triage required. Reset counter: \`gh variable set LARRY_DISPATCH_COUNT --repo ${{ github.repository }} --body '{\\\"count\\\":0,\\\"window_start\\\":\\\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\\\"}'\`\"
            }" > /dev/null

      - name: Run failure recovery agent
        id: larry-agent
        if: steps.larry-kill.outputs.killed != 'true' && steps.larry-counter.outputs.blocked != 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # --allowedTools grants the agent autonomy over bash, file ops, and
          # git. Without this, claude-code-action denies most tool calls (the
          # first dry-run hit 123 permission denials).
          # --max-turns caps reasoning iterations (replaces deprecated input).
          show_full_output: false
          claude_args: |
            --allowedTools "Bash,Edit,Read,Write,Glob,Grep"
            --max-turns 50
          additional_permissions: |
            actions: read
          prompt: |
            The sandbox-gate job FAILED for this deploy. Your job is to diagnose the failure, fix it, and get the pipeline passing.

            ## Context
            - Repository: ${{ github.repository }}
            - Commit: ${{ github.sha }}
            - Run ID: ${{ github.run_id }}
            - Project: ${{ inputs.project_name }}

            ## What to do

            1. Read sandbox-gate-logs.txt to understand what failed (test failures, publish errors, timeouts)
            2. Read verify-results/verify-result.json if it exists
            3. Search studiob-knowledge (Qdrant) for matching failure patterns:
               ```bash
               # Embed the error and search Qdrant
               VECTOR=$(curl -s https://api.voyageai.com/v1/embeddings \
                 -H "Authorization: Bearer $VOYAGE_API_KEY" \
                 -H "Content-Type: application/json" \
                 -d "{\"input\": [\"YOUR_ERROR_HERE\"], \"model\": \"voyage-3\", \"input_type\": \"query\"}" \
                 | python3 -c "import sys,json; print(json.dumps(json.load(sys.stdin)['data'][0]['embedding']))")
               curl -s "$QDRANT_URL/collections/studiob-knowledge/points/search" \
                 -H "Content-Type: application/json" \
                 -d "{\"vector\": $VECTOR, \"limit\": 5, \"with_payload\": true, \"filter\": {\"must\": [{\"key\": \"source_type\", \"match\": {\"any\": [\"incident\", \"runbook\"]}}]}}"
               ```
            4. Diagnose the root cause
            5. If you can fix it (code change, config change, missing DB column, test update):
               - Create a branch named `fix/larry-<short-description>`
               - Commit the fix, push, and create a PR with `gh pr create`
               - Post to #ops (see Slack section below)
            6. If you can't fix it (infrastructure issue, Acumatica bug, permissions):
               - Post to #ops with full diagnosis and recommendation
               - Include what you tried, what the KB said, and what you recommend

            ## Slack communication (REQUIRED — always post to #ops)

            Post to #ops channel (studiob-ai.slack.com):
            ```bash
            curl -sf -X POST "https://slack.com/api/chat.postMessage" \
              -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"channel":"C0AR2UW2S66","text":"YOUR MESSAGE HERE"}'
            ```

            ## Rules
            - Max 3 fix attempts per run. If your first fix doesn't work, try twice more, then escalate.
            - Never push directly to main. Always create a PR.
            - Never deploy to production. Your job is to fix and PR — the pipeline handles the rest.
            - Read agents/deploy-agent.md for Slack/Qdrant patterns if you need more context.
            - ALWAYS post to #ops with your diagnosis, whether you fixed it or not.

            ## Environment variables available
            - QDRANT_URL — Qdrant vector DB endpoint (studiob-knowledge collection)
            - VOYAGE_API_KEY — Voyage AI embedding API key
            - SLACK_BOT_TOKEN — Slack bot token for DMs and #ops posts
            - GH_TOKEN — GitHub token for git operations and gh CLI
        env:
          # studiob-ai.slack.com bot token for #ops posts.
          # The hfabrics SLACK_BOT_TOKEN can't reach #ops or Kevin's studiob user.
          SLACK_BOT_TOKEN: ${{ secrets.STUDIOB_SLACK_BOT_TOKEN }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          ACUDEV_URL: ${{ secrets.ACUDEV_URL }}
          ACUDEV_API_KEY: ${{ secrets.ACUDEV_API_KEY }}
          # Built-in GITHUB_TOKEN for git operations. Audit log shows
          # github-actions[bot] (Safety Package gate #2).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Post-agent Slack notification (always fires if agent ran) ─────
      # Post to #ops on studiob-ai.slack.com so Kevin gets notified.
      # Bot lacks im:write for DMs — @mention Kevin in #ops instead.
      # TODO: Add im:write to Studio B Admin app, then restore DMs.
      - name: Notify via Slack #ops
        if: always() && steps.larry-agent.outcome != 'skipped'
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ secrets.STUDIOB_SLACK_BOT_TOKEN }}
        run: |
          PROJECT="${{ inputs.project_name }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          AGENT_OUTCOME="${{ steps.larry-agent.outcome }}"

          if [ "$AGENT_OUTCOME" = "success" ]; then
            MSG=":robot_face: Larry agent completed for *${PROJECT}*. <${RUN_URL}|View diagnosis + fix PR>"
          else
            MSG=":warning: Larry agent failed/timed out for *${PROJECT}* (outcome: ${AGENT_OUTCOME}). Manual triage needed. <${RUN_URL}|View Logs>"
          fi

          curl -sf -X POST "https://slack.com/api/chat.postMessage" \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"channel\":\"C0AR2UW2S66\",\"text\":\"${MSG}\"}" > /dev/null \
            && echo "Posted to #ops" \
            || echo "::warning::#ops post failed"

  # ──────────────────────────────────────────────
  # Job: Post-Deploy Validation — run API/runtime tests
  # ──────────────────────────────────────────────
  post-deploy-validation:
    name: Post-Deploy Verification
    needs: [deploy]
    runs-on: ubuntu-latest
    # API-level smoke test against production after deploy.
    # UI tests already ran against sandbox in sandbox-gate.
    if: >
      needs.deploy.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout AcuOps pipeline
        uses: actions/checkout@v4
        with:
          repository: studio-b-ai/acuops-pipeline
          ref: ${{ vars.ACUOPS_PIPELINE_VERSION || 'main' }}
          path: pipeline
          ssh-key: ${{ secrets.ACUOPS_PIPELINE_DEPLOY_KEY }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          if [ -f pipeline/requirements.txt ]; then
            pip install -r pipeline/requirements.txt
          fi

      - name: Post-deploy smoke test
        timeout-minutes: 5
        continue-on-error: true
        env:
          ACUMATICA_URL: ${{ secrets.ACUMATICA_PROD_URL }}
          ACUMATICA_USERNAME: ${{ secrets.ACUMATICA_VERIFY_USERNAME || secrets.ACUMATICA_PROD_USERNAME }}
          ACUMATICA_PASSWORD: ${{ secrets.ACUMATICA_VERIFY_PASSWORD || secrets.ACUMATICA_PROD_PASSWORD }}
          ACUMATICA_TENANT: ${{ secrets.ACUMATICA_PROD_TENANT }}
        run: |
          python scripts/verify.py \
            --manifest publish-manifest.json \
            --environment production \
            --no-merge-expected acuops.yaml \
            --json-output verify-result.json

      - name: Publish test metrics
        if: always()
        env:
          CI_METRICS_URL: ${{ vars.CI_METRICS_URL }}
          CI_METRICS_AUTH: ${{ secrets.CI_METRICS_AUTH }}
        run: |
          if [ -n "${CI_METRICS_URL}" ] && [ -f pipeline/scripts/count-tests.py ]; then
            python pipeline/scripts/count-tests.py --post "${CI_METRICS_URL}" --auth "${CI_METRICS_AUTH}" || true
          elif [ -f pipeline/scripts/count-tests.py ]; then
            python pipeline/scripts/count-tests.py
          fi
